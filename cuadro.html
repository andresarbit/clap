<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CUADRO — Sistema Administrativo Dinámico de Productoras</title>
<style>
/* ============================================================
   CUADRO — design tokens
   ============================================================ */
:root{
  --bg:#0d0e10; --bg2:#141519; --bg3:#1b1d22; --bg4:#23262c;
  --line:#2c2f36; --line2:#3a3e46;
  --tx:#e8e9ec; --tx2:#9ba1ac; --tx3:#6b7280;
  --ac:#e0a92e;        /* dorado — acento principal */
  --ac2:#f2c65c;
  --ok:#3fb27f; --warn:#e0913e; --bad:#e05a5a; --info:#5b9bd5;
  --r:8px; --r2:12px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans);overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
.app{display:flex;flex-direction:column;height:100dvh}
header{background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:4px;flex:none}
.brand b{font-size:17px;letter-spacing:.16em;color:var(--ac);font-weight:800}
.brand span{font-size:10px;color:var(--tx3);letter-spacing:.06em}
.spacer{flex:1}
.tabs{display:flex;gap:2px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 13px;font-size:12.5px;color:var(--tx2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab.on{color:var(--ac);border-bottom-color:var(--ac)}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{padding:14px;max-width:1500px;margin:0 auto}

/* ---------- controls ---------- */
select,input[type=text],input[type=number],input[type=date],textarea{
  background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:6px 8px;
  color:var(--tx);outline:none;min-width:0;width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--ac);background:var(--bg4)}
select{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);
  background-position:calc(100% - 13px) 13px,calc(100% - 8px) 13px;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:6px 11px;font-size:12.5px;color:var(--tx2);white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--line2);color:var(--tx);background:var(--bg4)}
.btn.pri{background:var(--ac);color:#161005;border-color:var(--ac);font-weight:700}
.btn.pri:hover{background:var(--ac2);color:#161005}
.btn.dgr:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:11.5px}
.seg{display:flex;background:var(--bg3);border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.seg button{padding:6px 12px;font-size:12px;color:var(--tx3);font-weight:600}
.seg button.on{background:var(--ac);color:#161005}
.pick{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:0 0 0 9px;max-width:100%}
.pick label{font-size:9.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;font-weight:700;flex:none}
.pick select{border:none;background:var(--bg3);padding-left:4px;min-width:110px}
.pick select:focus{background:var(--bg3)}

/* ---------- cards ---------- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:12px;overflow:hidden}
.card>h3{padding:10px 13px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx2);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700}
.card>h3 .spacer{flex:1}
.pad{padding:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:3px}
.f>span{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.muted{color:var(--tx3)}
.empty{padding:34px 18px;text-align:center;color:var(--tx3);font-size:13px}

/* ---------- rubro / lineas ---------- */
.rubro{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--bg2);overflow:hidden}
.rhead{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--bg3);cursor:pointer;user-select:none}
.rhead:hover{background:var(--bg4)}
.rcode{font:600 10px var(--mono);color:var(--ac);background:rgba(224,169,46,.12);padding:2px 6px;border-radius:4px;flex:none}
.rname{font-weight:600;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtot{font:600 13px var(--mono);flex:none}
.caret{color:var(--tx3);font-size:10px;flex:none;width:10px}
.rbody{border-top:1px solid var(--line)}

/* fila de línea: grid que colapsa en celu */
.lh,.ln{display:grid;gap:6px;align-items:center;padding:6px 11px;
  grid-template-columns:1fr 88px 62px 62px 108px 74px 116px 30px}
.lh{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);
  background:var(--bg);border-bottom:1px solid var(--line);font-weight:700;position:sticky;top:0;z-index:2}
.ln{border-bottom:1px solid rgba(44,47,54,.5)}
.ln:hover{background:var(--bg3)}
.ln input,.ln select{padding:4px 6px;font-size:12.5px;background:transparent;border-color:transparent}
.ln input:hover,.ln select:hover{border-color:var(--line)}
.ln input:focus,.ln select:focus{background:var(--bg4);border-color:var(--ac)}
.num{text-align:right;font-family:var(--mono)}
.ltot{font:600 12.5px var(--mono);text-align:right;padding-right:4px}
.del{color:var(--tx3);font-size:15px;line-height:1;text-align:center;padding:4px}
.del:hover{color:var(--bad)}
.addln{padding:7px 11px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--bg)}

/* chips de circuito / comprobante */
.chip{font-size:9.5px;padding:2px 6px;border-radius:4px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.c-ban{background:rgba(91,155,213,.15);color:#8dc0ea}
.c-efe{background:rgba(224,145,62,.15);color:#e8ac6b}
.c-otr{background:rgba(155,161,172,.13);color:var(--tx2)}
.d-si{background:rgba(63,178,127,.15);color:#6fd0a3}
.d-no{background:rgba(224,90,90,.15);color:#ef8b8b}
.d-par{background:rgba(224,145,62,.15);color:#e8ac6b}
.ln select.chipsel{width:auto;font-size:10px;padding:1px 18px 1px 5px;border:none;
  background-position:calc(100% - 10px) 9px,calc(100% - 6px) 9px}

/* ---------- totales ---------- */
.tot{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(44,47,54,.6)}
.tot:last-child{border:none}
.tot b{font-family:var(--mono);font-weight:600}
.tot.big{padding-top:11px;margin-top:5px;border-top:2px solid var(--ac);border-bottom:none;font-size:15px}
.tot.big span{font-weight:700}
.tot.big b{color:var(--ac);font-size:17px;font-weight:800}
.tot.sub{color:var(--tx2);font-size:12.5px}
.stick{position:sticky;bottom:0;background:var(--bg2);border-top:1px solid var(--ac);
  padding:9px 13px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5;
  box-shadow:0 -6px 20px rgba(0,0,0,.45)}
.stick .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--tx3);font-weight:700}
.stick .val{font:800 19px var(--mono);color:var(--ac)}
.stick .alt{font:500 11.5px var(--mono);color:var(--tx3)}

/* ---------- tabla catálogo ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);
  padding:7px 9px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.tbl td{padding:6px 9px;border-bottom:1px solid rgba(44,47,54,.5);vertical-align:middle}
.tbl tr:hover td{background:var(--bg3)}
.scrollx{overflow-x:auto}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:100;backdrop-filter:blur(3px)}
.mod{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r2);width:100%;max-width:660px;
  max-height:88dvh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.mod>h3{padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;display:flex;align-items:center;gap:10px}
.mod>h3 .spacer{flex:1}
.mbody{padding:16px;overflow-y:auto;flex:1}
.mfoot{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg4);
  border:1px solid var(--ac);color:var(--tx);padding:10px 18px;border-radius:22px;z-index:200;font-size:13px;
  box-shadow:0 8px 30px rgba(0,0,0,.5)}

/* ---------- celular ---------- */
@media (max-width:860px){
  .wrap{padding:10px}
  .lh{display:none}
  .ln{grid-template-columns:1fr 1fr;gap:5px;padding:9px 10px;border-bottom:1px solid var(--line);
      background:var(--bg2);border-radius:6px;margin:6px 8px;position:relative}
  .ln>*:nth-child(1){grid-column:1/-1;padding-right:26px}
  .ln input,.ln select{border-color:var(--line);background:var(--bg3);padding:9px 8px;font-size:15px}
  .ln select{background-position:calc(100% - 13px) 17px,calc(100% - 8px) 17px}
  .ln .ltot{grid-column:1/-1;text-align:right;font-size:15px;padding-top:5px;border-top:1px solid var(--line)}
  .ln .del{position:absolute;top:2px;right:2px;font-size:20px;width:34px;height:34px}
  .btn,.btn.sm{padding:9px 13px;font-size:13px}
  .ln select.chipsel{font-size:12px;padding:7px 22px 7px 8px;
    background-position:calc(100% - 12px) 15px,calc(100% - 8px) 15px}
  .rhead{padding:12px 11px}
  .ln .mlbl::before{content:attr(data-l);font-size:8.5px;color:var(--tx3);display:block;
    text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px;font-weight:700}
  .stick .val{font-size:16px}
  .brand span{display:none}
}
/* ---------- impresión ---------- */
@media print{
  body{background:#fff;color:#000}
  header,.tabs,.stick,.addln,.noprint,.del{display:none!important}
  .card,.rubro{border-color:#ccc;background:#fff;break-inside:avoid}
  .rhead{background:#f2f2f2}
  .lh{background:#fafafa;color:#555}
  main{overflow:visible}
  .rcode{color:#8a6a12;background:#f6eed6}
  .tot.big b{color:#000}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================================
   CUADRO — Sistema Administrativo Dinámico de Productoras
   Prototipo v0.1 · presupuestador
   ----------------------------------------------------------------------------
   ARQUITECTURA (pensada para migrar a Postgres/Supabase sin rehacer el modelo)
     MODEL  — schema, catálogos maestros, semillas
     STORE  — persistencia (localStorage hoy, API mañana), export/import
     CALC   — motor de cálculo: líneas → rubros → capas → total
     UI     — render
   Toda entidad lleva id propio y las de proyecto cuelgan de productoraId.
   ============================================================================ */

/* ===========================  MODEL  ====================================== */

const SCHEMA_VERSION = 1;
const uid = p => (p||'x') + '_' + Math.random().toString(36).slice(2,9);

/* Rubros por defecto — estructura de presupuesto publicitario argentino.
   aplicaFee: si el fee de producción se calcula sobre este rubro.            */
const RUBROS_BASE = [
  {codigo:'01', nombre:'Preproducción y Gastos Generales', aplicaFee:true},
  {codigo:'02', nombre:'Dirección',                        aplicaFee:true},
  {codigo:'03', nombre:'Equipo de Producción',             aplicaFee:true},
  {codigo:'04', nombre:'Fotografía y Cámara',              aplicaFee:true},
  {codigo:'05', nombre:'Eléctrica y Grip',                 aplicaFee:true},
  {codigo:'06', nombre:'Arte, Utilería y Ambientación',    aplicaFee:true},
  {codigo:'07', nombre:'Vestuario, Maquillaje y Peinado',  aplicaFee:true},
  {codigo:'08', nombre:'Sonido',                           aplicaFee:true},
  {codigo:'09', nombre:'Elenco y Derechos de Imagen',      aplicaFee:false},
  {codigo:'10', nombre:'Locaciones y Permisos',            aplicaFee:true},
  {codigo:'11', nombre:'Equipamiento y Alquileres',        aplicaFee:true},
  {codigo:'12', nombre:'Transporte, Viáticos y Viajes',    aplicaFee:true},
  {codigo:'13', nombre:'Catering',                         aplicaFee:true},
  {codigo:'14', nombre:'Postproducción',                   aplicaFee:true},
  {codigo:'15', nombre:'Seguros y Legales',                aplicaFee:false},
];

/* Catálogo de funciones por rubro — para cargar líneas rápido.               */
const FUNCIONES = {
  '01':['Scouting','Casting','Pre Production Meeting','Permisos y trámites','Movilidad preproducción','Oficina y comunicaciones'],
  '02':['Director','Ayudante de Dirección (1° AD)','2° Ayudante de Dirección','Script / Continuista','Storyboard artist'],
  '03':['Productor Ejecutivo','Jefe de Producción','Coordinador de Producción','Asistente de Producción','Runner','Location Manager','Director de Casting','Fijador'],
  '04':['Director de Fotografía','Operador de Cámara','Foquista','Asistente de Cámara','DIT','Video Assist','Operador de Steadicam','Piloto de Drone'],
  '05':['Gaffer','Best Boy','Eléctrico','Key Grip','Grip','Maquinista','Generadorista'],
  '06':['Director de Arte','Asistente de Arte','Ambientador','Utilero','Escenógrafo','Constructor','Compras de arte','Construcción de set'],
  '07':['Vestuarista','Asistente de Vestuario','Compra / alquiler de vestuario','Maquillador/a','Peinador/a','Asistente de Maquillaje'],
  '08':['Sonidista Directo','Microfonista','Equipo de sonido directo'],
  '09':['Actor / Actriz Principal','Actor / Actriz Secundario','Extra','Modelo','Voz en off','Buyout / Cesión de derechos','Fee de agencia de casting'],
  '10':['Fee de locación','Permiso municipal / filmación','Fijador de locación','Estudio / plató','Servicios de locación','Limpieza y restitución'],
  '11':['Paquete cámara + ópticas','Paquete de luces','Paquete de grip','Grupo electrógeno','Camión de luces','Monitores','Handies / walkies','Carpa y catering rig','Baños químicos'],
  '12':['Combi de pasajeros','Camión de producción','Auto de producción','Combustible y peajes','Pasajes aéreos','Hotel','Viáticos / per diem','Chofer'],
  '13':['Desayuno','Almuerzo','Merienda / snacks','Agua y bebidas','Catering de elenco'],
  '14':['Postproductor','Montajista','Sala de edición','Colorista','VFX / composición','Diseño sonoro','Musicalización / derechos','Locución','Masterización y entregables'],
  '15':['Seguro de Accidentes Personales','ART','Responsabilidad Civil','Todo Riesgo Equipos','Honorarios contables','Honorarios legales','Impuesto al cheque / gastos bancarios'],
};

/* Unidades de contratación */
const UNIDADES = ['jornada','media jornada','hora','semana','global','unidad','día','km','persona'];

/* Circuito de pago y respaldo documental — la "ductilidad" del sistema.
   Se registra la realidad tal cual es: qué canal y qué comprobante.          */
const CIRCUITOS = [
  {v:'transferencia', l:'Transferencia', k:'ban'},
  {v:'cheque',        l:'Cheque',        k:'ban'},
  {v:'debito',        l:'Débito/Tarjeta',k:'ban'},
  {v:'mp',            l:'Mercado Pago',  k:'ban'},
  {v:'efectivo',      l:'Efectivo',      k:'efe'},
  {v:'usd',           l:'USD billete',   k:'efe'},
  {v:'cripto',        l:'Cripto / USDT', k:'otr'},
  {v:'',              l:'— sin definir', k:'otr'},
];
const COMPROBANTES = [
  {v:'facA',    l:'Factura A',     k:'si'},
  {v:'facBC',   l:'Factura B / C', k:'si'},
  {v:'reciboX', l:'Recibo oficial',k:'si'},
  {v:'reciboS', l:'Recibo simple', k:'par'},
  {v:'ninguno', l:'Sin comprobante',k:'no'},
  {v:'',        l:'— sin definir', k:'par'},
];

const CONDICIONES = ['Responsable Inscripto','Monotributista','Exento','Consumidor Final','Sociedad','Extranjero'];

/* Fábricas de entidades ---------------------------------------------------- */
function nuevaLinea(o={}){
  return {id:uid('ln'), concepto:o.concepto||'', refId:o.refId||null, refTipo:o.refTipo||null,
    cantidad:o.cantidad??1, dias:o.dias??1, unidad:o.unidad||'jornada',
    valorUnit:o.valorUnit??0, moneda:o.moneda||'ARS',
    circuito:o.circuito||'', comprobante:o.comprobante||'', notas:o.notas||''};
}
function nuevaVersion(o={}){
  return {id:uid('v'), nombre:o.nombre||'v1', fecha:o.fecha||hoy(), estado:o.estado||'borrador',
    monedaBase:o.monedaBase||'ARS', tc:o.tc??1000, tcFecha:o.tcFecha||hoy(), tcNombre:o.tcNombre||'MEP',
    capas:o.capas||{fee:15, contingencia:5, iibb:0, iva:21},
    notas:o.notas||'',
    rubros:o.rubros|| RUBROS_BASE.map(r=>({id:uid('rb'),...r, lineas:[], abierto:false}))};
}
function nuevoProyecto(o={}){
  return {id:uid('py'), nombre:o.nombre||'Proyecto nuevo', tipo:o.tipo||'publicidad',
    cliente:o.cliente||'', agencia:o.agencia||'', producto:o.producto||'',
    territorio:o.territorio||'Argentina', plazo:o.plazo||'12 meses', medios:o.medios||'Digital',
    jornadas:o.jornadas??1, versiones:o.versiones||[nuevaVersion()], versionActiva:null};
}
function nuevaProductora(o={}){
  return {id:uid('pr'), nombre:o.nombre||'Productora nueva', cuit:o.cuit||'',
    condicionIVA:o.condicionIVA||'Responsable Inscripto', jurisdiccion:o.jurisdiccion||'CABA',
    feeDefault:o.feeDefault??15, contingenciaDefault:o.contingenciaDefault??5,
    ivaDefault:o.ivaDefault??21, iibbDefault:o.iibbDefault??0,
    proyectos:o.proyectos||[]};
}
function nuevaPersona(o={}){
  return {id:uid('pe'), nombre:o.nombre||'', dni:o.dni||'', cuit:o.cuit||'',
    fechaNac:o.fechaNac||'', condicion:o.condicion||'Monotributista',
    funcion:o.funcion||'', rubro:o.rubro||'03',
    tarifaRef:o.tarifaRef??0, moneda:o.moneda||'ARS', unidad:o.unidad||'jornada',
    tel:o.tel||'', email:o.email||'', banco:o.banco||'', alias:o.alias||'', cbu:o.cbu||'',
    tipo:o.tipo||'persona'}; /* persona | proveedor | equipo */
}

function hoy(){const d=new Date();return d.toISOString().slice(0,10)}

/* ===========================  STORE  ====================================== */

const KEY = 'cuadro.db.v1';
let DB;

function dbVacia(){
  return {schemaVersion:SCHEMA_VERSION, org:{nombre:'Mi estudio'},
    catalogo:{personas:[]}, productoras:[],
    ui:{productoraId:null, proyectoId:null, versionId:null, vista:'interna', tab:'presu'}};
}

function cargar(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ DB = JSON.parse(raw); migrar(); return; }
  }catch(e){ console.warn('DB corrupta, arranco limpio', e); }
  DB = dbVacia(); sembrar(); guardar();
}
function migrar(){
  if(!DB.schemaVersion) DB.schemaVersion = 1;
  DB.catalogo ||= {personas:[]};
  DB.ui ||= {vista:'interna', tab:'presu'};
}
let _t;
function guardar(){
  clearTimeout(_t);
  _t = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
    catch(e){ toast('⚠ No se pudo guardar (espacio lleno)'); } }, 120);
}

/* Semilla: una productora con un proyecto de ejemplo, para que se entienda
   el modelo al abrirlo por primera vez.                                      */
function sembrar(){
  const cat = [
    nuevaPersona({nombre:'Martín Bevilacqua', funcion:'Director de Fotografía', rubro:'04', tarifaRef:450000, condicion:'Monotributista', cuit:'20-28456789-3', dni:'28456789'}),
    nuevaPersona({nombre:'Lucía Ferrer',      funcion:'Jefa de Producción',      rubro:'03', tarifaRef:320000, condicion:'Monotributista', cuit:'27-31222444-8', dni:'31222444'}),
    nuevaPersona({nombre:'Diego Roldán',      funcion:'Gaffer',                  rubro:'05', tarifaRef:280000, condicion:'Monotributista', dni:'30111222'}),
    nuevaPersona({nombre:'Casa de alquiler — Cinecolor', funcion:'Paquete cámara + ópticas', rubro:'11', tarifaRef:900000, condicion:'Responsable Inscripto', tipo:'proveedor'}),
    nuevaPersona({nombre:'Catering La Mesa',   funcion:'Almuerzo',               rubro:'13', tarifaRef:14000, unidad:'persona', condicion:'Monotributista', tipo:'proveedor'}),
  ];
  DB.catalogo.personas = cat;

const getPr = () => DB.productoras.find(p=>p.id===DB.ui.productoraId) || DB.productoras[0] || null;
const getPy = () => { const pr=getPr(); if(!pr) return null;
  return pr.proyectos.find(p=>p.id===DB.ui.proyectoId) || pr.proyectos[0] || null; };
const getV  = () => { const py=getPy(); if(!py) return null;
  return py.versiones.find(v=>v.id===DB.ui.versionId) || py.versiones[0] || null; };

/* ===========================  CALC  ======================================= */

const n = x => { const v = parseFloat(String(x??'').replace(',','.')); return isFinite(v)?v:0; };

/* tc = unidades de ARS por 1 USD */
function conv(monto, de, a, tc){
  if(de===a) return monto;
  if(de==='USD' && a==='ARS') return monto * tc;
  if(de==='ARS' && a==='USD') return tc ? monto / tc : 0;
  return monto;
}
function totalLinea(l, v){
  const bruto = n(l.cantidad) * n(l.dias) * n(l.valorUnit);
  return conv(bruto, l.moneda||'ARS', v.monedaBase, n(v.tc));
}
function totalRubro(r, v){ return r.lineas.reduce((s,l)=>s+totalLinea(l,v), 0); }

/* Motor: subtotal → fee → contingencia → IIBB → IVA → total.
   El fee sólo se aplica sobre los rubros marcados aplicaFee (el elenco y los
   seguros normalmente se pasan a costo, sin fee).                            */
function calcular(v){
  let subtotal=0, baseFee=0;
  const porRubro = v.rubros.map(r=>{
    const t = totalRubro(r,v);
    subtotal += t; if(r.aplicaFee) baseFee += t;
    return {id:r.id, codigo:r.codigo, nombre:r.nombre, total:t, lineas:r.lineas.length};
  });
  const c = v.capas;
  const fee          = baseFee  * n(c.fee)/100;
  const contingencia = subtotal * n(c.contingencia)/100;
  const netoPrevio   = subtotal + fee + contingencia;
  const iibb         = netoPrevio * n(c.iibb)/100;
  const neto         = netoPrevio + iibb;
  const iva          = neto * n(c.iva)/100;
  const total        = neto + iva;
  return {porRubro, subtotal, baseFee, fee, contingencia, iibb, neto, iva, total};
}

/* Exposición documental: cuánto del costo directo tiene respaldo fiscal.     */
function exposicion(v){
  const r = {facturado:0, parcial:0, sinRespaldo:0, sinDefinir:0,
             bancario:0, efectivo:0, otro:0, total:0};
  v.rubros.forEach(rb=>rb.lineas.forEach(l=>{
    const t = totalLinea(l,v); r.total += t;
    const kc = (CIRCUITOS.find(c=>c.v===(l.circuito||''))||{}).k;
    if(kc==='ban') r.bancario+=t; else if(kc==='efe') r.efectivo+=t; else r.otro+=t;
    const kd = (COMPROBANTES.find(c=>c.v===(l.comprobante||''))||{}).k;
    if(!l.comprobante) r.sinDefinir+=t;
    else if(kd==='si') r.facturado+=t;
    else if(kd==='par') r.parcial+=t;
    else r.sinRespaldo+=t;
  }));
  return r;
}

/* ===========================  FORMATO  ==================================== */

const fmt = (x, mon='ARS') => (mon==='USD'?'US$ ':'$ ') +
  Math.round(n(x)).toLocaleString('es-AR');
const fmtC = x => Math.round(n(x)).toLocaleString('es-AR');
const esc  = s => String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pct  = (p,t) => t ? Math.round(p/t*100) : 0;

}

function bajar(nombre, contenido, tipo){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([contenido],{type:tipo}));
  a.download=nombre; a.click(); URL.revokeObjectURL(a.href); }

function expJSON(){ bajar(`cuadro-${hoy()}.json`, JSON.stringify(DB,null,2), 'application/json');
  toast('Respaldo descargado'); }
function impJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{ try{
      const d=JSON.parse(fr.result);
      if(!d.productoras) throw new Error('formato');
      if(!confirm('Esto reemplaza todos los datos actuales. ¿Seguir?')) return;
      DB=d; migrar(); cerrar(); toast('Respaldo importado');
    }catch(e){ alert('El archivo no es un respaldo válido de CUADRO.'); } };
  fr.readAsText(f); }
function expCSV(){
  const v=getV(), py=getPy(); if(!v) return;
  const q = s => '"'+String(s??'').replace(/"/g,'""')+'"';
  const L = [['Rubro','Código','Concepto','Unidad','Cantidad','Días','Valor unit.','Moneda',
              'Total '+v.monedaBase,'Circuito','Comprobante'].map(q).join(',')];
  v.rubros.forEach(r=>r.lineas.forEach(l=>L.push([r.nombre,r.codigo,l.concepto,l.unidad,l.cantidad,
    l.dias,l.valorUnit,l.moneda,Math.round(totalLinea(l,v)),
    (CIRCUITOS.find(c=>c.v===l.circuito)||{}).l||'',
    (COMPROBANTES.find(c=>c.v===l.comprobante)||{}).l||''].map(q).join(','))));
  const R2=calcular(v);
  L.push('', [q('Subtotal'),'','','','','','','',Math.round(R2.subtotal)].join(','));
  L.push([q(`Fee ${v.capas.fee}%`),'','','','','','','',Math.round(R2.fee)].join(','));
  L.push([q(`Contingencia ${v.capas.contingencia}%`),'','','','','','','',Math.round(R2.contingencia)].join(','));
  L.push([q(`IVA ${v.capas.iva}%`),'','','','','','','',Math.round(R2.iva)].join(','));
  L.push([q('TOTAL'),'','','','','','','',Math.round(R2.total)].join(','));
  bajar(`${py.nombre}-${v.nombre}.csv`, '﻿'+L.join('\n'), 'text/csv;charset=utf-8');
  toast('CSV descargado'); }
