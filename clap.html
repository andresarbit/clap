<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLAP — Control, Logística y Administración de Producción</title>
<style>
/* ============================================================
   CLAP — design tokens
   ============================================================ */
:root{
  --bg:#0d0e10; --bg2:#141519; --bg3:#1b1d22; --bg4:#23262c;
  --line:#2c2f36; --line2:#3a3e46;
  --tx:#e8e9ec; --tx2:#9ba1ac; --tx3:#6b7280;
  --ac:#e0a92e;        /* dorado — acento principal */
  --ac2:#f2c65c;
  --ok:#3fb27f; --warn:#e0913e; --bad:#e05a5a; --info:#5b9bd5;
  --r:8px; --r2:12px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans);overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
.app{display:flex;flex-direction:column;height:100dvh}
header{background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;justify-content:center;gap:0;margin-right:6px;flex:none}
.brand b{font-size:18px;letter-spacing:.22em;color:var(--ac);font-weight:800;line-height:1.05}
.brand span{font-size:8.5px;color:var(--tx3);letter-spacing:.02em;line-height:1.2;
  text-transform:uppercase;font-weight:600;white-space:nowrap}
.spacer{flex:1}
.tabs{display:flex;gap:2px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 13px;font-size:12.5px;color:var(--tx2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab.on{color:var(--ac);border-bottom-color:var(--ac)}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{padding:14px;max-width:1500px;margin:0 auto}

/* ---------- controls ---------- */
select,input[type=text],input[type=number],input[type=date],textarea{
  background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:6px 8px;
  color:var(--tx);outline:none;min-width:0;width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--ac);background:var(--bg4)}
select{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);
  background-position:calc(100% - 13px) 13px,calc(100% - 8px) 13px;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:6px 11px;font-size:12.5px;color:var(--tx2);white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--line2);color:var(--tx);background:var(--bg4)}
.btn.pri{background:var(--ac);color:#161005;border-color:var(--ac);font-weight:700}
.btn.pri:hover{background:var(--ac2);color:#161005}
.btn.dgr:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:11.5px}
.seg{display:flex;background:var(--bg3);border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.seg button{padding:6px 12px;font-size:12px;color:var(--tx3);font-weight:600}
.seg button.on{background:var(--ac);color:#161005}
.pick{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:0 0 0 9px;max-width:100%}
.pick label{font-size:9.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;font-weight:700;flex:none}
.pick select{border:none;background:var(--bg3);padding-left:4px;min-width:110px}
.pick select:focus{background:var(--bg3)}

/* ---------- cards ---------- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:12px;overflow:hidden}
.card>h3{padding:10px 13px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx2);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700}
.card>h3 .spacer{flex:1}
.pad{padding:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:3px}
.f>span{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.muted{color:var(--tx3)}
.empty{padding:34px 18px;text-align:center;color:var(--tx3);font-size:13px}

/* ---------- rubro / lineas ---------- */
.rubro{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--bg2);overflow:hidden}
.rhead{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--bg3);cursor:pointer;user-select:none}
.rhead:hover{background:var(--bg4)}
.rcode{font:600 10px var(--mono);color:var(--ac);background:rgba(224,169,46,.12);padding:2px 6px;border-radius:4px;flex:none}
.rname{font-weight:600;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtot{font:600 13px var(--mono);flex:none}
.caret{color:var(--tx3);font-size:10px;flex:none;width:10px}
.rbody{border-top:1px solid var(--line)}

/* fila de línea: grid que colapsa en celu */
.lh,.ln{display:grid;gap:6px;align-items:center;padding:6px 11px;
  grid-template-columns:1fr 88px 62px 62px 108px 74px 116px 30px}
.lh{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);
  background:var(--bg);border-bottom:1px solid var(--line);font-weight:700;position:sticky;top:0;z-index:2}
.ln{border-bottom:1px solid rgba(44,47,54,.5)}
.ln:hover{background:var(--bg3)}
.ln input,.ln select{padding:4px 6px;font-size:12.5px;background:transparent;border-color:transparent}
.ln input:hover,.ln select:hover{border-color:var(--line)}
.ln input:focus,.ln select:focus{background:var(--bg4);border-color:var(--ac)}
.num{text-align:right;font-family:var(--mono)}
.ltot{font:600 12.5px var(--mono);text-align:right;padding-right:4px}
.del{color:var(--tx3);font-size:15px;line-height:1;text-align:center;padding:4px}
.del:hover{color:var(--bad)}
.addln{padding:7px 11px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--bg)}

/* chips de circuito / comprobante */
.chip{font-size:9.5px;padding:2px 6px;border-radius:4px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.c-ban{background:rgba(91,155,213,.15);color:#8dc0ea}
.c-efe{background:rgba(224,145,62,.15);color:#e8ac6b}
.c-otr{background:rgba(155,161,172,.13);color:var(--tx2)}
.d-si{background:rgba(63,178,127,.15);color:#6fd0a3}
.d-no{background:rgba(224,90,90,.15);color:#ef8b8b}
.d-par{background:rgba(224,145,62,.15);color:#e8ac6b}
.ln select.chipsel{width:auto;font-size:10px;padding:1px 18px 1px 5px;border:none;
  background-position:calc(100% - 10px) 9px,calc(100% - 6px) 9px}

/* ---------- totales ---------- */
.tot{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(44,47,54,.6)}
.tot:last-child{border:none}
.tot b{font-family:var(--mono);font-weight:600}
.tot.big{padding-top:11px;margin-top:5px;border-top:2px solid var(--ac);border-bottom:none;font-size:15px}
.tot.big span{font-weight:700}
.tot.big b{color:var(--ac);font-size:17px;font-weight:800}
.tot.sub{color:var(--tx2);font-size:12.5px}
.stick{position:sticky;bottom:0;background:var(--bg2);border-top:1px solid var(--ac);
  padding:9px 13px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5;
  box-shadow:0 -6px 20px rgba(0,0,0,.45)}
.stick .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--tx3);font-weight:700}
.stick .val{font:800 19px var(--mono);color:var(--ac)}
.stick .alt{font:500 11.5px var(--mono);color:var(--tx3)}

/* ---------- tabla catálogo ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);
  padding:7px 9px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.tbl td{padding:6px 9px;border-bottom:1px solid rgba(44,47,54,.5);vertical-align:middle}
.tbl tr:hover td{background:var(--bg3)}
.scrollx{overflow-x:auto}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:100;backdrop-filter:blur(3px)}
.mod{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r2);width:100%;max-width:660px;
  max-height:88dvh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.mod>h3{padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;display:flex;align-items:center;gap:10px}
.mod>h3 .spacer{flex:1}
.mbody{padding:16px;overflow-y:auto;flex:1}
.mfoot{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg4);
  border:1px solid var(--ac);color:var(--tx);padding:10px 18px;border-radius:22px;z-index:200;font-size:13px;
  box-shadow:0 8px 30px rgba(0,0,0,.5)}

/* ---------- desglose de guion ---------- */
.resu{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;background:var(--line)}
.resu>div{background:var(--bg2);padding:10px 12px}
.resu b{display:block;font:700 19px var(--mono);color:var(--ac);line-height:1.15}
.resu span{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);font-weight:700}
.subtabs{display:flex;gap:2px;padding:8px 13px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtab{padding:7px 12px;font-size:12px;color:var(--tx2);border-radius:6px 6px 0 0;white-space:nowrap;font-weight:600}
.subtab.on{background:var(--bg4);color:var(--ac)}

/* pasos del importador: que se vea de una que hay que tocar Desglosar */
.pasos{display:flex;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.paso{background:var(--bg3);padding:8px 12px;flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.paso b{width:19px;height:19px;border-radius:50%;background:var(--bg4);color:var(--tx3);
  display:grid;place-items:center;font-size:10.5px;font-weight:800;flex:none}
.paso.on b{background:var(--ac);color:#161005}
.paso span{font-size:11px;color:var(--tx3);line-height:1.3}
.paso.on span{color:var(--tx)}
.paso i{font-style:normal;color:var(--ac);font-weight:700}
.ginfo{margin-top:7px;font-size:12px;line-height:1.5;min-height:18px}
.gbien{color:var(--ok);font-weight:700}
.gmal{color:var(--warn);font-weight:700}
.ginfo code{font-family:var(--mono);background:var(--bg4);padding:1px 5px;border-radius:3px;font-size:11px}
.gaviso{color:var(--warn)}
.avisomodo{background:rgba(224,145,62,.09);border:1px solid rgba(224,145,62,.35);border-radius:var(--r);
  padding:9px 12px;margin-bottom:9px;font-size:12px;line-height:1.55;color:var(--tx2)}
.avisomodo b{color:var(--warn)}
.esctools{border-top:1px dashed var(--line);padding-top:7px;margin-top:2px}
.elmas.dgr:hover{color:var(--bad);border-color:var(--bad)}
.lineadiv{width:100%;text-align:left;margin-bottom:3px;border-color:transparent;font-size:12px;
  white-space:normal;line-height:1.4}
.lineadiv:hover{border-color:var(--ac);color:var(--ac)}
.btn.grande{padding:9px 20px;font-size:14px}

.esc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--bg2);overflow:hidden}
/* campos del encabezado de escena: editables, pero sin verse como formulario */
.ed{border:1px solid transparent;background:transparent;cursor:pointer}
.ed:hover{border-color:var(--line2)}
input.eloc{padding:2px 5px;border-radius:4px}
input.eloc:focus{background:var(--bg4);border-color:var(--ac);cursor:text}
select.emom{width:auto;padding:2px 17px 2px 5px;background-image:none;flex:none}
select.emom:focus{background:var(--bg4);border-color:var(--ac)}
button.eie:hover{filter:brightness(1.35)}
.ehead{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--bg3);flex-wrap:wrap}
.enum{font:800 13px var(--mono);color:var(--ac);min-width:24px;flex:none}
.eie{font:700 9.5px var(--mono);padding:2px 5px;border-radius:3px;flex:none;letter-spacing:.04em}
.eie.int{background:rgba(91,155,213,.16);color:#8dc0ea}
.eie.ext{background:rgba(63,178,127,.16);color:#6fd0a3}
.eloc{font-weight:600;font-size:13px;flex:1;min-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emom{font-size:10px;color:var(--tx3);letter-spacing:.05em;font-weight:700;flex:none}
.emom.noche{color:#8dc0ea}
.epg{font:600 11px var(--mono);color:var(--tx2);flex:none}
.ebody{padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.drow{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.dlbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;
  width:112px;flex:none;padding-top:5px;display:flex;align-items:center;gap:5px}
.ddot{width:7px;height:7px;border-radius:2px;flex:none}
.dels{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:150px}
.el{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 5px 3px 8px;
  border-radius:4px;border:1px solid;background:transparent;line-height:1.3}
.el.sug{border-style:dashed;opacity:.82}
.el button{font-size:13px;line-height:1;opacity:.5;padding:0 1px}
.el button:hover{opacity:1;color:var(--bad)}
.elmas{font-size:11.5px;color:var(--tx3);border:1px dashed var(--line2);border-radius:4px;padding:3px 7px}
.elmas:hover{color:var(--ac);border-color:var(--ac)}
.etxt{font-size:11.5px;color:var(--tx3);line-height:1.5;white-space:pre-wrap;
  border-left:2px solid var(--line);padding:2px 0 2px 9px;margin-top:2px;max-height:120px;overflow-y:auto}
.jda{display:flex;align-items:center;gap:5px;flex:none}
.jda select{width:auto;font-size:11px;padding:3px 20px 3px 7px;background-position:calc(100% - 11px) 11px,calc(100% - 7px) 11px}
.jhead{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--bg4);
  border-radius:var(--r) var(--r) 0 0;border:1px solid var(--line);border-bottom:none;margin-top:12px}
.jhead b{font-size:13px}
.sinasig{border-color:var(--warn)}
.solo-cel{display:none}
.ecar{color:var(--tx3);font-size:11px;flex:none;width:9px}
.ecnt{font:600 10px var(--mono);color:var(--tx3);flex:none}

/* ---------- callsheet ---------- */
.cs{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.cshead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  padding:14px 16px;border-bottom:2px solid var(--ac);flex-wrap:wrap}
.csttl{font-size:20px;font-weight:800;line-height:1.15}
.cssub{font-size:11.5px;color:var(--tx3);margin-top:3px}
.csj{font:800 17px var(--mono);color:var(--ac);letter-spacing:.04em}
.csj span{font-size:11px;color:var(--tx3);font-weight:600;letter-spacing:0}
.cshoras{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line)}
.cshoras>div{background:var(--bg3);padding:9px 12px}
.cshoras b{display:block;font:700 15px var(--mono);color:var(--tx);line-height:1.2}
.cshoras span{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);font-weight:700}
.csblock{border-top:1px solid var(--line)}
.csblock>h4{padding:8px 16px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--ac);background:var(--bg3);font-weight:800}
.cst input{padding:3px 6px;font-size:12px;background:transparent;border-color:transparent}
.cst input:hover{border-color:var(--line)}
.cst input:focus{background:var(--bg4);border-color:var(--ac)}
.cst .enum{color:var(--ac);font:800 12px var(--mono)}
tr.csdep td{background:var(--bg3);font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--tx2);font-weight:800;padding:5px 9px}
.csloc{padding:9px 16px;border-bottom:1px solid rgba(44,47,54,.5)}
.csloc:last-child{border:none}
.cslocn{font-weight:700;font-size:13px;margin-bottom:5px}
.cslocd{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px}
.csfoot{padding:9px 16px;border-top:1px solid var(--line);font-size:10px;color:var(--tx3);text-align:center}
/* lista de contactos */
.ctab td{vertical-align:middle}
.crol{font-size:12px}
.cnom{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:12.5px}
.clink{font-style:normal;font-size:9px;color:var(--ac);opacity:.75}
.ctab input{width:100%}
.ctab input[type=email]{font-size:11.5px}
.csblock>h4 .btn{font-weight:600;letter-spacing:0;text-transform:none}
/* portada / resumen */
.resl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);font-weight:800;margin-bottom:4px}
.resd{font-size:12.5px;line-height:1.5}
.pendfila{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 4px;
  border-bottom:1px solid rgba(44,47,54,.6);font-size:13px;color:var(--tx)}
.pendfila:last-child{border-bottom:none}
.pendfila:hover{background:var(--bg3)}
.pendn{min-width:26px;height:22px;border-radius:11px;background:var(--bg4);color:var(--tx2);
  display:grid;place-items:center;font:800 11.5px var(--mono);flex:none;padding:0 6px}
.pendfila.urg .pendn{background:var(--ac);color:#161005}
.pendir{margin-left:auto;color:var(--tx3)}
.pendfila:hover .pendir{color:var(--ac)}

/* equipo, gastos y circuito de aprobación */
.pick.sesion{border-color:rgba(224,169,46,.45);background:rgba(224,169,46,.07)}
.pick.sesion label{color:var(--ac)}
.pick.sesion select{background:transparent}
.est{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.03em;
  padding:2px 7px;border-radius:20px;border:1px solid;white-space:nowrap}
.estdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:baseline}
.clip{font-size:11px;opacity:.7;margin-left:4px}
.barra{display:block;height:7px;background:var(--bg4);border-radius:4px;overflow:hidden;min-width:60px}
.barra i{display:block;height:100%;border-radius:4px;transition:width .2s}
.barra2{display:flex}
.barra2 i{border-radius:0}
.filtros{display:flex;gap:7px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.filtros select{width:auto;min-width:120px;max-width:260px}
.filtros input[type=text]{width:auto;min-width:170px;flex:1;max-width:320px}
.adj{display:flex;flex-direction:column;gap:5px}
.adj img{max-width:100%;max-height:230px;object-fit:contain;border:1px solid var(--line);
  border-radius:var(--r);background:var(--bg)}
.linea-tiempo{display:flex;flex-direction:column;gap:0}
.hito{display:flex;gap:10px;align-items:flex-start;padding:0 0 11px;position:relative;font-size:12.5px}
.hito:not(:last-child)::before{content:'';position:absolute;left:5px;top:14px;bottom:0;width:1px;background:var(--line2)}
.hito i{width:11px;height:11px;border-radius:50%;flex:none;margin-top:3px;z-index:1;
  box-shadow:0 0 0 3px var(--bg2)}

/* tarifario de convenio */
.sica{font:600 10.5px var(--mono);color:var(--info);background:rgba(91,155,213,.13);
  padding:2px 6px;border-radius:4px;flex:none}

/* Busca el cargo del SICA que corresponde a una función.
   La escala escribe los cargos en las dos formas de género ("DIRECTOR/A DE
   FOTOGRAFIA", "JEFE/A"), así que hay que sacar ese sufijo para comparar.    */
const normCargo = s => norm(s).replace(/\/\s*[ao]\b/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function sicaDe(funcion, rubro){
  if(!funcion) return null;
  const f = normCargo(funcion);
  if(!f) return null;
  const cand = SICA.cargos.filter(c=>!rubro || c.r===rubro);
  const pool = cand.length ? cand : SICA.cargos;
  return pool.find(c=>normCargo(c.c)===f)
      || pool.find(c=>{ const n0=normCargo(c.c);
           return n0.length>3 && f.length>3 && (n0.includes(f) || f.includes(n0)); })
      || null;
}

/* Lo comprometido es la OC emitida menos lo que ya llegó como factura: si no
   se resta, el mismo gasto contaría dos veces.                               */

  return Math.max(0, total - facturadoDeOC(py, oc.id, base, tc));

/* --- El tablero de plata --------------------------------------------------
   Presupuestado / Comprometido / Real / Pagado / Disponible, rubro por rubro.
   Es la vista que mira un productor todos los días.                          */
function resumenPlata(py, v){
  const base = v ? v.monedaBase : 'ARS', tc = v ? n(v.tc) : 1000;
  const enBase = (m, mon) => conv(n(m), mon||'ARS', base, tc);
  const cs = (py.comprobantes||[]).filter(c=>c.estado!=='rechazado');
  const ocs = py.ocs || [];

  const filas = (v?v.rubros:[]).map(r=>{
    const presu = totalRubro(r, v);
    const real = cs.filter(c=>c.rubro===r.codigo).reduce((s,c)=>s+enBase(c.importe,c.moneda), 0);
    const pagado = cs.filter(c=>c.rubro===r.codigo && c.estado==='pagado')
      .reduce((s,c)=>s+enBase(c.importe,c.moneda), 0);
    const comp = ocs.filter(o=>o.rubro===r.codigo)
      .reduce((s,o)=>s+comprometidoDeOC(py, o, base, tc), 0);
    const cant = cs.filter(c=>c.rubro===r.codigo).length;
    return {codigo:r.codigo, nombre:r.nombre, presu, comp, real, pagado, cant,
      disponible: presu - comp - real, desvio: (comp + real) - presu};
  });
  const T = k => filas.reduce((s,f)=>s+f[k], 0);
  return {filas, base,
    presu:T('presu'), comp:T('comp'), real:T('real'), pagado:T('pagado'),
    disponible:T('disponible'), desvio: T('comp')+T('real')-T('presu')};
}

/* Qué puede hacer este usuario con este comprobante, ahora. */
function accionesDe(c, u){
  if(!u || c.estado==='pagado' || c.estado==='rechazado') return [];
  const est = EST(c.estado);
  const out = [];
  if(est.sig && puede(u, est.sig)) out.push(est.sig);
  if(puede(u,'revisar')) out.push('rechazar');
  return out;
}

function moverComprobante(id, accion, nota){
  const c = getComprobantes().find(x=>x.id===id); if(!c) return;
  const u = getUsuario();
  const antes = c.estado;
  c.estado = accion==='rechazar' ? 'rechazado' : (ACCION_ESTADO[accion] || c.estado);
  c.historial.push({de:antes, a:c.estado, accion, usuario:u?u.nombre:'—',
    usuarioId:u?u.id:null, rol:u?u.rol:null, fecha:hoy(), nota:nota||''});
}

/* Totales: qué se lleva gastado por rubro y en qué estado está.             */
function resumenGastos(py, v){
  const cs = py.comprobantes || [];
  const tc = v ? n(v.tc) : 1000, base = v ? v.monedaBase : 'ARS';
  const enBase = c => conv(n(c.importe), c.moneda||'ARS', base, tc);
  const porRubro = {}, porEstado = {};
  ESTADOS.forEach(e=>porEstado[e.k]={cant:0, total:0});
  cs.forEach(c=>{
    const t = enBase(c);
    porEstado[c.estado] ||= {cant:0,total:0};
    porEstado[c.estado].cant++; porEstado[c.estado].total += t;
    if(c.estado==='rechazado') return;
    porRubro[c.rubro] ||= {gastado:0, cant:0, pagado:0};
    porRubro[c.rubro].gastado += t; porRubro[c.rubro].cant++;
    if(c.estado==='pagado') porRubro[c.rubro].pagado += t;
  });
  /* contra el presupuesto */
  const filas = (v?v.rubros:[]).map(r=>{
    const g = porRubro[r.codigo] || {gastado:0, cant:0, pagado:0};
    const presu = totalRubro(r, v);
    return {codigo:r.codigo, nombre:r.nombre, presu, ...g,
      desvio: g.gastado - presu, pct: presu ? g.gastado/presu*100 : (g.gastado?Infinity:0)};
  });
  const sinRubro = Object.keys(porRubro).filter(k=>!filas.some(f=>f.codigo===k));
  return {filas, porEstado, sinRubro, base,
    totalGastado: filas.reduce((s,f)=>s+f.gastado,0),
    totalPresu:   filas.reduce((s,f)=>s+f.presu,0),
    totalPagado:  filas.reduce((s,f)=>s+f.pagado,0)};
}

/* Foto de la factura. Se achica fuerte: en localStorage el espacio es poco y
   una foto de celular sin tocar se lo come entero.                          */
function achicarImagen(file, maxLado=1400, calidad=0.6){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('No pude leer el archivo'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('El archivo no es una imagen que pueda abrir'));
      img.onload = () => {
        const esc = Math.min(1, maxLado/Math.max(img.width, img.height));
        const w = Math.round(img.width*esc), h = Math.round(img.height*esc);
        const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        const url = cv.toDataURL('image/jpeg', calidad);
        res({nombre:file.name, tipo:'image/jpeg', dataUrl:url,
          bytes: Math.round(url.length*0.75), w, h});
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* Cuánto lugar queda. localStorage suele ser 5 MB por origen. */
function espacioUsado(){
  let b = 0;
  try{ b = new Blob([localStorage.getItem(KEY)||'']).size; }catch(e){ b = (localStorage.getItem(KEY)||'').length; }
  return {bytes:b, mb:b/1048576, pct: Math.min(100, b/(5*1048576)*100)};
}

/* ---------------------------- RODAJE -------------------------------------
   El parte de rodaje: lo que un asistente de producción llena en el set.
   Horarios reales, quién entró y salió a qué hora, e incidencias. De ahí
   salen las horas extra, que es donde se va la plata de un rodaje.           */
function nuevoParte(o={}){
  return {primeraToma:o.primeraToma||'', comidaIn:o.comidaIn||'', comidaOut:o.comidaOut||'',
    ultimaToma:o.ultimaToma||'', wrap:o.wrap||'', comidasServidas:o.comidasServidas??0,
    filmadas:o.filmadas||[],            /* ids de escenas efectivamente filmadas */
    fichadas:o.fichadas||{},            /* { clave: {entrada, salida, nota} } */
    citados:o.citados||{},              /* { clave: true } — ya se le avisó */
    incidencias:o.incidencias||'', climaReal:o.climaReal||''};
}
/* Condiciones de la jornada. Se configuran por proyecto porque cambian según
   el convenio y el tipo de trabajo.                                          */
function nuevaConfigRodaje(o={}){
  return {horasJornada:o.horasJornada??8, recargoHE:o.recargoHE??50,
    descontarComida:o.descontarComida!==false, minTurnaround:o.minTurnaround??12,
    telProduccion:o.telProduccion||''};
}

const hhmm = t => { const m=String(t||'').match(/^(\d{1,2}):?(\d{2})$/); return m ? (+m[1])*60 + (+m[2]) : null; };
const minAHoras = m => (m/60);
const fmtHoras = m => { if(m==null) return '—';
  const neg = m<0; m=Math.abs(Math.round(m));
  return (neg?'-':'') + Math.floor(m/60) + ':' + String(m%60).padStart(2,'0'); };

/* Minutos entre dos horas; si la salida es menor, cruzó la medianoche.       */
function lapso(desde, hasta){
  const a=hhmm(desde), b=hhmm(hasta);
  if(a==null || b==null) return null;
  return b>=a ? b-a : (b+24*60)-a;
}

/* Horas de una persona en una jornada, con su costo de hora extra.           */
function horasDe(clave, j, cfg, valorJornada, moneda){
  const f = (j.parte?.fichadas||{})[clave] || {};
  const brutos = lapso(f.entrada, f.salida);
  if(brutos==null) return {sinDatos:true, entrada:f.entrada||'', salida:f.salida||''};
  let comida = 0;
  if(cfg.descontarComida){
    const c = lapso(j.parte?.comidaIn, j.parte?.comidaOut);
    if(c!=null && c>0 && c<240) comida = c;
  }
  const netos = Math.max(0, brutos - comida);
  const base = cfg.horasJornada*60;
  const extra = Math.max(0, netos - base);
  const valorHora = valorJornada ? valorJornada / Math.max(1,cfg.horasJornada) : 0;
  const costoHE = extra/60 * valorHora * (1 + n(cfg.recargoHE)/100);
  return {sinDatos:false, entrada:f.entrada, salida:f.salida, nota:f.nota||'',
    brutos, comida, netos, extra, valorHora, costoHE, moneda:moneda||'ARS'};
}

/* Todos los que participan de una jornada, técnicos y elenco, con lo que hace
   falta para citarlos y para liquidarles las horas.                          */
function gentePorJornada(py, v, num){
  const C = armarCallsheet(py, v, num);
  const man = (py.contactos && py.contactos.porLinea) || {};
  const linea = id => { for(const r of (v?.rubros||[])){ const l=r.lineas.find(x=>x.id===id); if(l) return l; } return null; };

  const crew = C.crew.map(c=>{
    const l = linea(c.clave.slice(2));
    return {clave:c.clave, grupo:c.depto, rol:c.funcion, nombre:c.nombre,
      tel:c.tel, email:c.email, tipo:'tecnico',
      valorJornada: l ? n(l.valorUnit) : 0, moneda: l ? l.moneda : 'ARS'};
  });

  /* al elenco se le busca su línea en el rubro 09 por el nombre del personaje */
  const r9 = (v?.rubros||[]).find(r=>r.codigo==='09');
  const elenco = C.elenco.map(p=>{
    const l = r9 ? r9.lineas.find(x=>norm(x.concepto)===norm(p.personaje)) : null;
    const g = l ? (man['l:'+l.id]||{}) : {};
    const pe = p.persona || (l && l.refId ? DB.catalogo.personas.find(x=>x.id===l.refId) : null);
    return {clave:p.clave, grupo:'Elenco', rol:p.personaje,
      nombre: pe?pe.nombre:(g.nombre||''), tel: pe?pe.tel:(g.tel||''), email: pe?pe.email:(g.email||''),
      tipo:'elenco', escenas:p.escenas,
      valorJornada: l ? n(l.valorUnit) : 0, moneda: l ? l.moneda : 'ARS'};
  });
  return {gente:[...elenco, ...crew], callsheet:C};
}

/* Texto de la citación que se le manda a cada uno.                           */
function textoCitacion(pr, py, j, C, p, cfg){
  const cit = (j.citaciones[p.clave]||{});
  const hora = cit.citacion || j.citacion || '';
  const locs = C.locaciones.map(l=>{
    const d = j.direcciones[l]||{};
    return l + (d.direccion ? ' — ' + d.direccion : '');
  });
  const L = [];
  L.push(`CITACIÓN · ${py.nombre}`);
  L.push(`Jornada ${j.numero}${j.fecha ? ' · ' + j.fecha + ' (' + diaSemana(j.fecha) + ')' : ''}`);
  L.push('');
  L.push(`${p.rol}${p.nombre ? ': ' + p.nombre : ''}`);
  L.push(`Citación: ${hora || 'a confirmar'}`);
  if(cit.maquillaje) L.push(`Maquillaje: ${cit.maquillaje}`);
  if(cit.set)        L.push(`En set: ${cit.set}`);
  L.push('');
  if(locs.length) L.push('Locación: ' + locs.join(' | '));
  if(p.escenas?.length) L.push('Escenas: ' + p.escenas.join(', '));
  if(j.wrap) L.push('Wrap estimado: ' + j.wrap);
  if(j.hospital?.nombre) L.push(`Hospital: ${j.hospital.nombre}${j.hospital.tel ? ' ' + j.hospital.tel : ''}`);
  if(j.notas) { L.push(''); L.push(j.notas); }
  L.push('');
  L.push(`${pr.nombre}${cfg.telProduccion ? ' · Producción: ' + cfg.telProduccion : ''}`);
  return L.join('\n');
}

/* Normaliza un teléfono argentino al formato que espera WhatsApp.
   Es best-effort: si el número viene raro, se abre igual y se corrige a mano. */
function telWhatsapp(tel){
  let d = String(tel||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.startsWith('00')) d = d.slice(2);
  if(d.startsWith('54')){
    d = d.slice(2);
    if(d.startsWith('9')) d = d.slice(1);
  }
  if(d.startsWith('0')) d = d.slice(1);
  /* el 15 va después de la característica: 11 15 xxxx xxxx, 351 15 xxx xxxx */
  d = d.replace(/^(\d{2,4})15(\d{6,8})$/, '$1$2');
  if(d.length < 8) return '';
  return '549' + d;
}

/* Un contacto suelto: los que no salen de una línea de presupuesto (cliente,
   agencia, el productor de la agencia, un contacto de la marca).             */
function nuevoContacto(o={}){
  return {id:uid('ct'), grupo:o.grupo||'Producción y cliente', rol:o.rol||'',
    nombre:o.nombre||'', tel:o.tel||'', email:o.email||'', notas:o.notas||''};

/* Lista de contactos del proyecto: TODOS los implicados, con teléfono y mail.
   Sale de las mismas líneas del presupuesto que alimentan el callsheet, más
   los contactos sueltos que se cargan a mano.                                */
function armarContactos(py, v){
  py.contactos ||= {porLinea:{}, extra:[]};
  py.contactos.porLinea ||= {}; py.contactos.extra ||= [];
  const C = py.contactos;
  const grupos = [];
  const push = (nombre, filas) => { if(filas.length) grupos.push({nombre, filas}); };

  /* datos guardados: si la línea está enlazada al catálogo, manda el catálogo */
  const fila = (clave, rol, refId) => {
    const pe = refId ? DB.catalogo.personas.find(x=>x.id===refId) : null;
    const g = C.porLinea[clave] || {};
    return {clave, rol, refId: pe?pe.id:null,
      nombre: pe ? pe.nombre : (g.nombre||''),
      tel:    pe ? pe.tel    : (g.tel||''),
      email:  pe ? pe.email  : (g.email||'')};
  };

  const extrasDe = g => C.extra.filter(x=>x.grupo===g).map(x=>({
    clave:'x:'+x.id, rol:x.rol, nombre:x.nombre, tel:x.tel, email:x.email, extra:true}));

  /* 1. producción, cliente y agencia */
  push('Producción y cliente', [
    ...(py.cliente ? [{clave:'x:cliente', rol:'Cliente', nombre:py.cliente, tel:'', email:'', fijo:true}] : []),
    ...(py.agencia ? [{clave:'x:agencia', rol:'Agencia', nombre:py.agencia, tel:'', email:'', fijo:true}] : []),
    ...extrasDe('Producción y cliente')]);

  /* 2. equipo técnico, por departamento */
  if(v) v.rubros.filter(r=>RUBROS_CREW.includes(r.codigo)).forEach(r=>
    push(r.nombre, [...r.lineas.filter(l=>l.concepto.trim()).map(l=>fila('l:'+l.id, l.concepto, l.refId)),
                    ...extrasDe(r.nombre)]));

  /* 3. elenco */
  if(v){
    const r9 = v.rubros.find(r=>r.codigo==='09');
    push('Elenco', [...(r9?r9.lineas.filter(l=>l.concepto.trim()).map(l=>fila('l:'+l.id, l.concepto, l.refId)):[]),
                    ...extrasDe('Elenco')]);
  }

  /* 4. proveedores */
  if(v){
    const provs = v.rubros.filter(r=>RUBROS_PROV.includes(r.codigo))
      .flatMap(r=>r.lineas.filter(l=>l.concepto.trim()).map(l=>fila('l:'+l.id, l.concepto, l.refId)));
    push('Proveedores', [...provs, ...extrasDe('Proveedores')]);
  }

  /* 5. locaciones: el contacto sale de la dirección cargada en la jornada */
  const locs = [...new Set((py.desglose?.escenas||[]).map(e=>e.locacion))];
  push('Locaciones', [...locs.map(l=>{
      const j = (py.desglose.jornadas||[]).find(x=>x.direcciones && x.direcciones[l]);
      const dd = j ? j.direcciones[l] : {};
      const g = C.porLinea['loc:'+l] || {};
      return {clave:'loc:'+l, rol:l, nombre:g.nombre || dd.contacto || '',
        tel:g.tel||'', email:g.email||'', dir:dd.direccion||''};
    }), ...extrasDe('Locaciones')]);

  const todos = grupos.flatMap(g=>g.filas);
  return {grupos, total:todos.length,
    mails:[...new Set(todos.map(f=>f.email).filter(x=>x && x.includes('@')))],
    sinDatos: todos.filter(f=>!f.tel && !f.email).length};
}

/* Arma el callsheet de una jornada juntando guion + presupuesto + catálogo.   */
function armarCallsheet(py, v, numJornada){
  const d = py.desglose;
  const j = normalizarJornada(d.jornadas.find(x=>x.numero===numJornada) || nuevaJornada({numero:numJornada}));
  const escenas = d.escenas.filter(e=>e.jornada===numJornada)
    .sort((a,b)=>String(a.numero).localeCompare(String(b.numero),undefined,{numeric:true}));
  const octavos = escenas.reduce((s,e)=>s+e.octavos,0);
  const locaciones = [...new Set(escenas.map(e=>e.locacion))];

  /* elenco: los personajes con diálogo en las escenas del día */
  const elenco = [...new Set(escenas.flatMap(e=>e.personajes))].sort().map(p=>({
    clave:'p:'+p, personaje:p,
    escenas: escenas.filter(e=>e.personajes.includes(p)).map(e=>e.numero),
    persona: DB.catalogo.personas.find(x=>norm(x.nombre)===norm(p) || norm(x.funcion)===norm(p)) || null,
  }));

  /* equipo técnico: las líneas de los rubros de crew del presupuesto activo */
  const crew = [];
  const man = (py.contactos && py.contactos.porLinea) || {};
  if(v) v.rubros.filter(r=>RUBROS_CREW.includes(r.codigo)).forEach(r=>{
    r.lineas.forEach(l=>{
      if(!l.concepto.trim()) return;
      const pe = l.refId ? DB.catalogo.personas.find(x=>x.id===l.refId) : null;
      const g = man['l:'+l.id] || {};
      crew.push({clave:'l:'+l.id, rubro:r.codigo, depto:r.nombre, funcion:l.concepto,
        nombre: pe?pe.nombre:(g.nombre||''), tel: pe?pe.tel:(g.tel||''),
        email: pe?pe.email:(g.email||''), persona:pe});
    });
  });

  /* elementos del día, agrupados por departamento */
  const elementos = {};
  escenas.forEach(e=>Object.entries(e.elementos).forEach(([k,vals])=>{
    elementos[k] ||= new Set(); vals.forEach(x=>elementos[k].add(x)); }));

  return {j, escenas, octavos, locaciones, elenco, crew,
    elementos: Object.fromEntries(Object.entries(elementos).map(([k,s])=>[k,[...s]])),
    totalJornadas: d.jornadas.length};
}

/* --- Lectura de archivos --------------------------------------------------
   Sin librerías externas: el navegador ya trae DecompressionStream, así que
   el .docx (que es un ZIP) y los streams comprimidos del PDF se inflan solos.
   Cada extractor devuelve texto plano; el parser de guion hace el resto.     */

const FORMATOS = '.txt, .fountain, .fdx, .docx, .rtf, .pdf, .doc';

async function inflar(bytes, raw){
  const ds = new DecompressionStream(raw ? 'deflate-raw' : 'deflate');
  const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return new Uint8Array(buf);
}
const latin1 = b => { let s=''; const N=8192;
  for(let i=0;i<b.length;i+=N) s += String.fromCharCode.apply(null, b.subarray(i,i+N));
  return s; };
const utf8 = b => new TextDecoder('utf-8').decode(b);
const desentidad = s => s.replace(/&#(\d+);/g,(m,d)=>String.fromCharCode(+d))
  .replace(/&#x([0-9a-f]+);/gi,(m,h)=>String.fromCharCode(parseInt(h,16)))
  .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")
  .replace(/&amp;/g,'&');
const limpiar = t => t.replace(/\r\n?/g,'\n').replace(/[\t ]+/g,' ')
  .replace(/ +\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();

/* ZIP: leer el directorio central y sacar una entrada por nombre.            */
async function zipEntrada(bytes, nombre){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocd = -1;
  for(let i=bytes.length-22; i>=Math.max(0,bytes.length-66000); i--)
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  if(eocd<0) throw new Error('No parece un archivo .docx válido (no encontré el índice del ZIP).');
  const total = dv.getUint16(eocd+10,true);
  let p = dv.getUint32(eocd+16,true);
  for(let i=0;i<total;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const metodo = dv.getUint16(p+10,true);
    const compLen = dv.getUint32(p+20,true);
    const nLen = dv.getUint16(p+28,true), eLen = dv.getUint16(p+30,true), cLen = dv.getUint16(p+32,true);
    const off = dv.getUint32(p+42,true);
    const nom = latin1(bytes.subarray(p+46, p+46+nLen));
    if(nom===nombre){
      const lnLen = dv.getUint16(off+26,true), leLen = dv.getUint16(off+28,true);
      const ini = off+30+lnLen+leLen;
      const datos = bytes.subarray(ini, ini+compLen);
      return metodo===0 ? datos : await inflar(datos, true);
    }
    p += 46+nLen+eLen+cLen;
  }
  throw new Error('No encontré '+nombre+' adentro del archivo.');
}

/* .docx — el texto vive en word/document.xml                                 */
async function docxATexto(bytes){
  const xml = utf8(await zipEntrada(bytes,'word/document.xml'));
  return limpiar(desentidad(xml
    .replace(/<w:tab[^>]*\/>/g,'  ')
    .replace(/<w:br[^>]*\/>/g,'\n')
    .replace(/<\/w:p>/g,'\n')
    .replace(/<[^>]+>/g,'')));
}

/* .fdx — Final Draft. Es XML con el tipo de cada párrafo, así que reconstruyo
   el formato de guion exacto: es el import de mejor calidad.                 */
function fdxATexto(txt){
  const out=[]; const re=/<Paragraph\b([^>]*)>([\s\S]*?)<\/Paragraph>/g;
  let m;
  while((m=re.exec(txt))){
    const tipo=(m[1].match(/Type="([^"]*)"/)||[,''])[1];
    const cuerpo=desentidad(m[2].replace(/<[^>]+>/g,'')).trim();
    if(!cuerpo) continue;
    if(/Scene Heading/i.test(tipo)) out.push('','' + cuerpo.toUpperCase(),'');
    else if(/Character/i.test(tipo)) out.push('', cuerpo.toUpperCase());
    else if(/Transition/i.test(tipo)) out.push('', cuerpo.toUpperCase(),'');
    else out.push(cuerpo);
  }
  if(!out.length) throw new Error('No encontré párrafos de guion en el .fdx.');
  return limpiar(out.join('\n'));
}

/* .rtf — sacar grupos de control y quedarse con el texto                     */
function rtfATexto(s){
  s = s.replace(/\\'([0-9a-f]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16)))
       .replace(/\\u(-?\d+)\s?\??/g,(m,d)=>String.fromCharCode(((+d)+65536)%65536))
       .replace(/\{\\\*[^{}]*\}/g,'')
       .replace(/\\par[d]?\b/g,'\n').replace(/\\line\b/g,'\n').replace(/\\tab\b/g,'  ')
       .replace(/\\[a-z]+-?\d*\s?/gi,'').replace(/[{}]/g,'');
  return limpiar(s);
}

/* .pdf — recorrer los streams de contenido, inflar los que estén comprimidos
   y leer los operadores de texto (Tj / TJ / ' / "). Sirve para PDF de texto;
   un PDF escaneado es una imagen y no tiene texto que leer.                  */
async function pdfATexto(bytes){
  const s = latin1(bytes);
  if(/\/Encrypt\b/.test(s.slice(0,Math.min(s.length,4000))) || /\/Encrypt\s+\d+\s+\d+\s+R/.test(s))
    throw new Error('El PDF está protegido con contraseña. Quitale la protección o exportalo de nuevo.');
  const partes=[]; let i=0;
  while((i = s.indexOf('stream', i)) !== -1){
    const dictIni = s.lastIndexOf('<<', i);
    const dict = dictIni<0 ? '' : s.slice(dictIni, i);
    let ini = i+6;
    if(s[ini]==='\r') ini++;
    if(s[ini]==='\n') ini++;
    const fin = s.indexOf('endstream', ini);
    if(fin<0) break;
    i = fin+9;
    if(/\/Image|\/DCTDecode|\/JPXDecode|\/CCITTFaxDecode/.test(dict)) continue;
    /* el largo real lo da /Length; si no está, recorto el salto de línea que
       va antes de `endstream` (si se lo dejo, zlib rechaza el stream entero) */
    let corte = fin;
    const mLen = dict.match(/\/Length\s+(\d+)/);
    if(mLen && ini + +mLen[1] <= fin) corte = ini + +mLen[1];
    else while(corte>ini && (bytes[corte-1]===10 || bytes[corte-1]===13)) corte--;
    let datos = bytes.subarray(ini, corte);
    if(/\/FlateDecode/.test(dict)){
      try{ datos = await inflar(datos, false); }
      catch(e){ try{ datos = await inflar(datos, true); }catch(e2){ continue; } }
    } else if(/\/Filter/.test(dict)) continue;   /* filtro que no sé leer */
    partes.push(latin1(datos));
  }
  if(!partes.length) throw new Error('No pude leer el contenido del PDF.');
  const txt = partes.map(contenidoPdfATexto).join('\n');
  if(txt.replace(/\s/g,'').length < 40)
    throw new Error('El PDF no tiene texto adentro: parece escaneado o exportado como imagen.\n\n' +
      'Necesitás un PDF de texto (el que exporta Final Draft, Celtx o Word), o pasarle un OCR antes.');
  return limpiar(txt);
}

/* Lee un flujo de contenido PDF y arma las líneas de texto.                  */
function contenidoPdfATexto(c){
  const lineas=[]; let act='';
  const salto = () => { if(act.trim()) lineas.push(act.trimEnd()); act=''; };
  const literal = t => t.replace(/\\([nrtbf()\\])/g,(m,ch)=>
      ({n:'\n',r:'',t:' ',b:'',f:'','(':'(',')':')','\\':'\\'}[ch]))
    .replace(/\\([0-7]{1,3})/g,(m,o)=>String.fromCharCode(parseInt(o,8)));
  /* hex string <...> o literal (...) seguidos de Tj/TJ/'/" ; y operadores de
     posición que implican renglón nuevo */
  /* T* va como alternativa propia: después de un asterisco no hay borde de
     palabra, así que \b nunca lo matchearía y se perderían los renglones */
  const re = /\((?:\\[\s\S]|[^\\()])*\)|<[0-9A-Fa-f\s]*>|T\*|\bT[jJdDmL]\b|\bET\b|'|"/g;
  let m, buf=[];
  while((m = re.exec(c))){
    const tk = m[0];
    if(tk[0]==='('){ buf.push(literal(tk.slice(1,-1))); }
    else if(tk[0]==='<' && tk[1]!=='<'){
      const h = tk.slice(1,-1).replace(/\s/g,'');
      let t='';
      if(h.length%4===0 && h.length>=4){                      /* UTF-16BE */
        for(let k=0;k<h.length;k+=4) t+=String.fromCharCode(parseInt(h.substr(k,4),16));
      } else for(let k=0;k+1<h.length;k+=2) t+=String.fromCharCode(parseInt(h.substr(k,2),16));
      buf.push(t);
    }
    else if(tk==='Tj'||tk==='TJ'||tk==="'"||tk==='"'){ act += buf.join(''); buf=[];
      if(tk==="'"||tk==='"') salto(); }
    else if(tk==='Td'||tk==='TD'||tk==='T*'||tk==='Tm'||tk==='ET'){ buf=[]; salto(); }
    else buf=[];
  }
  salto();
  return lineas.join('\n');
}

/* .doc viejo (binario OLE): no hay forma limpia sin librería. Rescato las
   corridas de texto legible y aviso que hay que revisarlo.                   */
function docATexto(bytes){
  const u16=[]; let run='';
  for(let i=0;i+1<bytes.length;i+=2){
    const c = bytes[i] | (bytes[i+1]<<8);
    if(bytes[i+1]===0 && (c===9||c===10||c===13||(c>=32&&c<127)) || (c>=160&&c<0x2100)) run += String.fromCharCode(c);
    else { if(run.length>3) u16.push(run); run=''; }
  }
  if(run.length>3) u16.push(run);
  let mejor = u16.join('\n');
  const a=[]; run='';
  for(let i=0;i<bytes.length;i++){
    const c=bytes[i];
    if(c===9||c===10||c===13||(c>=32&&c<127)||(c>=192&&c<256)) run+=String.fromCharCode(c);
    else { if(run.length>3) a.push(run); run=''; }
  }
  if(run.length>3) a.push(run);
  const ascii = a.join('\n');
  if(ascii.length > mejor.length*1.4) mejor = ascii;
  mejor = limpiar(mejor.replace(/[^\S\n]{3,}/g,' '));
  if(mejor.replace(/\s/g,'').length<40)
    throw new Error('No pude sacar texto de este .doc.\n\nAbrilo en Word y guardalo como .docx, .rtf o .txt.');
  return mejor;
}

/* Despachador: elige el extractor por extensión.                             */
async function archivoATexto(file){
  const ext = (file.name.match(/\.[^.]+$/)||[''])[0].toLowerCase();
  if(ext==='.txt'||ext==='.fountain'||ext==='.md'||ext==='') return limpiar(await file.text());
  if(ext==='.fdx') return fdxATexto(await file.text());
  if(ext==='.rtf') return rtfATexto(await file.text());
  const bytes = new Uint8Array(await file.arrayBuffer());
  if(ext==='.pdf')  return await pdfATexto(bytes);
  if(ext==='.docx') return await docxATexto(bytes);
  if(ext==='.doc'){
    /* algunos .doc en realidad son .docx o .rtf renombrados */
    if(bytes[0]===0x50&&bytes[1]===0x4b) return await docxATexto(bytes);
    if(latin1(bytes.subarray(0,5))==='{\\rtf') return rtfATexto(latin1(bytes));
    return docATexto(bytes);
  }
  throw new Error('Formato no reconocido ('+ext+').\n\nAcepto: '+FORMATOS);
}

/* --- Parser de guion ------------------------------------------------------
   Reconoce formato estándar y Fountain. Un encabezado es INT/EXT + locación
   + momento; un personaje es una línea corta en mayúsculas seguida de texto. */
const RE_SLUG = /^\s*(?:(\d+[A-Za-z]?)[\.\)]?\s+)?(INT\.?\s*\/\s*EXT\.?|EXT\.?\s*\/\s*INT\.?|I\s*\/\s*E|INT\b\.?|EXT\b\.?|INTERIOR\b|EXTERIOR\b)\s*[\.\-—:]*\s*(.+)$/i;
/* Encabezado sin INT/EXT: el guion publicitario suele venir numerado por
   escena, plano o toma. Se toma igual y el INT/EXT se corrige con un click.  */
const RE_SLUG2 = /^\s*(?:ESCENA|ESC\.?|SECUENCIA|SEC\.?|PLANO|TOMA|CUADRO|SHOT|SCENE)\s*[Nn°º]?\s*(\d+[A-Za-z]?)\s*[\.\)\-–—:]*\s*(.*)$/i;
const RE_TRANS = /^\s*(CORTE A|CORTA A|FUNDE|FUNDIDO|DISOLVENCIA|ENCADENA|CUT TO|FADE (IN|OUT)|DISSOLVE|SMASH CUT|FIN|THE END)\b.*$/i;

/* Reconoce un encabezado de escena en cualquiera de los dos formatos.        */
function matchEncabezado(t){
  if(t.length>=160) return null;
  let m = t.match(RE_SLUG);
  if(m){
    const ie = norm(m[2]).replace(/[\.\s]/g,'');
    return {numero:m[1]||'', resto:m[3],
      intExt: ie.startsWith('inte')&&ie.length>4 ? 'INT' : ie.startsWith('exte')&&ie.length>4 ? 'EXT'
            : /^(int\/ext|ext\/int|ie)$/.test(ie) ? 'INT/EXT' : ie.startsWith('int') ? 'INT' : 'EXT'};
  }
  m = t.match(RE_SLUG2);
  if(m && !RE_TRANS.test(t)){
    const r = norm(m[2]);
    const ie = /\bext/.test(r) ? 'EXT' : /\bint/.test(r) ? 'INT' : 'INT';
    /* si el INT/EXT venía adentro ya lo tomé: no debe quedar en la locación */
    const resto = m[2].replace(/^\s*(INT\.?\s*\/\s*EXT\.?|EXT\.?\s*\/\s*INT\.?|INT|EXT|INTERIOR|EXTERIOR)\b\.?\s*[\-–—:]?\s*/i,'');
    return {numero:m[1], resto, intExt:ie};
  }
  return null;
}

function parseGuion(txt){
  const lineas = String(txt).replace(/\r\n?/g,'\n').split('\n');
  const escenas = []; let act = null; let nAuto = 0;

  const cerrar = () => { if(act){ act.octavos = Math.max(1, Math.round(act._lineas/6.875)); escenas.push(act); } };

  for(let i=0;i<lineas.length;i++){
    const cru = lineas[i], t = cru.trim();
    const m = matchEncabezado(t);
    if(m){
      cerrar();
      /* separar locación de momento por el último guion */
      let resto = m.resto.trim().replace(/\s+\d+[A-Za-z]?$/,'');   /* número al final */
      let loc = resto, mom = '';
      const partes = resto.split(/\s+[\-–—]\s+|\s{2,}/);
      if(partes.length>1){
        const ult = partes[partes.length-1].trim().replace(/\.$/,'');
        if(MOMENTOS.some(x=>norm(x)===norm(ult)) || norm(ult).length<=14){
          mom = ult.toUpperCase(); loc = partes.slice(0,-1).join(' - ').trim();
        }
      }
      act = nuevaEscena({
        numero: m.numero || String(++nAuto),
        encabezado: t, intExt: m.intExt,
        locacion: loc.replace(/[\.:]$/,'').trim() || 'Sin locación',
        momento: mom || 'DÍA'});
      act._lineas = 0; act.texto = '';
      continue;
    }
    if(!act) continue;                       /* encabezado de guion, títulos, etc. */
    if(RE_TRANS.test(t) && t===t.toUpperCase()) continue;
    act._lineas++;
    act.texto += cru + '\n';
    /* personaje: línea corta en mayúsculas con algo debajo */
    if(t && t.length<=42 && !/^\(.*\)$/.test(t)){
      const soloLetras = t.replace(/\([^)]*\)/g,'').replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/g,'');
      /* la siguiente línea CON CONTENIDO: los guiones a doble espacio (típico
         de un PDF o un RTF) dejan un renglón vacío entre el nombre y el diálogo */
      let sig=''; for(let k=i+1;k<lineas.length && k<=i+3;k++){
        const x=lineas[k].trim(); if(x){ sig=x; break; } }
      if(soloLetras.length>1 && soloLetras===soloLetras.toUpperCase() && sig && !matchEncabezado(sig)){
        const nom = t.replace(/\([^)]*\)/g,'').replace(/[:：]$/,'').trim();
        if(nom && nom.length>1 && !act.personajes.includes(nom)) act.personajes.push(nom);
      }
    }
  }
  cerrar();
  escenas.forEach(e=>{ delete e._lineas; detectar(e); });
  return escenas;
}

/* --- Guion SIN encabezados -----------------------------------------------
   La mayoría de los guiones de publicidad no tienen ni un INT./EXT.: son
   prosa corrida, una lista de planos o una tabla VIDEO | AUDIO. Para esos se
   corta por párrafo y se INFIERE la locación y el momento del texto. Es una
   propuesta para corregir a mano, no una lectura exacta.                     */

/* Lugares frecuentes, con su INT/EXT probable. */
const LUGARES = {
  INT:['cocina','living','comedor','bano','dormitorio','habitacion','pieza','oficina','aula','escuela',
    'bar','restaurante','negocio','local','supermercado','super','kiosco','banco','hospital','consultorio',
    'gimnasio','estudio','galpon','garage','cochera','ascensor','pasillo','sala','casa','departamento',
    'depto','hotel','cine','teatro','iglesia','subte','deposito','fabrica','taller','peluqueria','farmacia',
    'panaderia','heladeria','quincho','altillo','sotano','probador','shopping','aeropuerto','cabina',
    'lavadero','recepcion','sala de espera','vestuario','barra','mostrador','pasilllo','oficina','comisaria'],
  EXT:['calle','vereda','plaza','parque','patio','jardin','terraza','balcon','playa','campo','ruta',
    'autopista','cancha','estacionamiento','montana','rio','bosque','esquina','azotea','muelle','pileta',
    'piscina','avenida','barrio','puerto','desierto','sierra','laguna','costanera','feria','obra','techo',
    'camino','sendero','estadio','vereda','parrilla','camping','bosque','puente','peaje','semaforo'],
};
/* Pistas de momento del día en prosa. */
const PISTAS_MOMENTO = [
  [/\b(de noche|nocturn[oa]|anochecer|la noche|oscurid|a oscuras)\b/, 'NOCHE'],
  [/\b(atardecer|crepusculo|cae el sol|puesta del sol|caida del sol)\b/, 'ATARDECER'],
  [/\b(amanecer|al alba|sale el sol|madrugada|primera luz)\b/, 'AMANECER'],
  [/\b(de tarde|la tarde|siesta|media tarde)\b/, 'TARDE'],
  [/\b(de manana|la manana|desayuno|temprano|primera hora)\b/, 'MAÑANA'],
  [/\b(de dia|solead[oa]|pleno sol|luz del dia|mediodia|al sol)\b/, 'DÍA'],
];
/* Frases que en un guion publicitario suelen abrir un plano nuevo. */
const RE_CORTE = /(?:^|(?<=[.:;!?])\s+)(?=(?:corte a|cortamos a|cut to|abrimos en|abre en|abrimos con|cierra en|cierre|cerramos|vemos|se ve|aparece|pasamos a|primer plano|primerisimo primer plano|plano general|plano detalle|plano medio|contraplano|paneo|travelling|zoom in|zoom out|acto seguido|de golpe|luego|despues)\b)/i;
/* Palabras en mayúscula que NO son personajes. */
const NO_PERSONAJE = new Set(['INT','EXT','DIA','DÍA','NOCHE','TARDE','FIN','VIDEO','AUDIO','OFF','VOZ','VO',
  'SFX','FX','MUS','LOGO','PACK','SUPER','ZOOM','CUT','TO','THE','END','CORTE','PLANO','TOMA','ESCENA','SEC',
  'SPOT','TV','TVC','CLIENTE','PRODUCTO','MARCA','TITULO','TÍTULO','CLAIM','PACKSHOT','SLOGAN','ON','OK']);

/* Una tabla VIDEO | AUDIO pegada de Word llega con tabs o muchos espacios.
   Se aplana: primero la columna de imagen, después la de audio.              */
function aplanarTabla(txt){
  const lineas = txt.replace(/\r\n?/g,'\n').split('\n');
  const conCols = lineas.filter(l=>l.trim() && /\t| {3,}/.test(l));
  const conTexto = lineas.filter(l=>l.trim());
  if(!conTexto.length || conCols.length / conTexto.length < 0.34) return txt;  /* no es tabla */
  const out=[];
  lineas.forEach(l=>{
    if(!l.trim()){ out.push(''); return; }
    const p = l.split(/\t+| {3,}/).map(x=>x.trim()).filter(Boolean);
    if(p.length<2){ out.push(l.trim()); return; }
    if(/^(video|imagen|image)$/i.test(p[0])) return;      /* encabezado de la tabla */
    out.push(p[0]);
    p.slice(1).forEach(x=>out.push(x));
    out.push('');   /* cada fila de la tabla es un plano aparte */
  });
  return out.join('\n');
}

/* Divide el guion en bloques que van a ser las escenas/planos. */
function bloquesLibres(txt){
  let t = aplanarTabla(txt).replace(/\r\n?/g,'\n');
  let bl = t.split(/\n\s*\n+/).map(b=>b.trim()).filter(Boolean);
  /* descartar un título suelto arriba de todo */
  if(bl.length>1 && bl[0].split('\n').length===1 && bl[0].length<70 &&
     bl[0]===bl[0].toUpperCase() && !/[.]/.test(bl[0])) bl.shift();
  /* si vino todo de corrido, cortar por las frases que abren plano */
  if(bl.length===1 && bl[0].length>260){
    const p = bl[0].split(RE_CORTE).map(x=>x.trim()).filter(Boolean);
    if(p.length>1) bl = p;
  }
  /* un bloque larguísimo se corta también por esas frases */
  if(bl.length>1) bl = bl.flatMap(b=> b.length>500
    ? b.split(RE_CORTE).map(x=>x.trim()).filter(Boolean) : [b]);
  /* un bloque que es puro diálogo o puro sonido no es un plano nuevo:
     va pegado al anterior (si no, "MADRE: Listo." contaría como una escena) */
  const soloDialogo = b => {
    const ls = b.split('\n').map(x=>x.trim()).filter(Boolean);
    return ls.length && ls.length<=3 &&
      ls.every(l=>/^[A-ZÁÉÍÓÚÑÜ][A-ZÁÉÍÓÚÑÜ\s\.'()]{0,30}\s*[:：]/.test(l));
  };
  const out=[];
  bl.forEach(b=>{ if(out.length && soloDialogo(b)) out[out.length-1] += '\n' + b; else out.push(b); });
  return out;
}

function parseGuionLibre(txt){
  const bl = bloquesLibres(txt);
  if(!bl.length) return [];
  let locPrev='', iePrev='INT', momPrev='DÍA';
  return bl.map((b,i)=>{
    const t = norm(b);
    /* locación: primer lugar conocido que aparezca; si no hay, sigue el anterior */
    let loc='', ie='';
    for(const [k,palabras] of Object.entries(LUGARES)){
      for(const p of palabras){
        const pos = t.indexOf(' '+p);
        if(pos>=0 || t.startsWith(p)){
          const cand = p.toUpperCase();
          if(!loc || (pos>=0 && pos < t.indexOf(' '+norm(loc)))){ loc=cand; ie=k; }
        }
      }
    }
    if(/\b(interior|adentro|dentro de)\b/.test(t)) ie='INT';
    if(/\b(exterior|afuera|a la calle|al aire libre)\b/.test(t)) ie='EXT';
    if(!loc){ loc = locPrev || 'Sin locación'; ie = ie || iePrev; }
    /* momento */
    let mom='';
    for(const [re,val] of PISTAS_MOMENTO) if(re.test(t)){ mom=val; break; }
    if(!mom) mom = momPrev;
    locPrev=loc; iePrev=ie||'INT'; momPrev=mom;

    const e = nuevaEscena({numero:String(i+1), encabezado:b.split('\n')[0].slice(0,90),
      intExt:ie||'INT', locacion:loc, momento:mom, texto:b,
      octavos: Math.max(1, Math.round(b.split('\n').length/6.875) || Math.round(b.length/380*8) || 1)});
    e.personajes = personajesLibres(b);
    detectar(e);
    return e;
  });
}

/* En prosa los personajes vienen en MAYÚSCULA la primera vez ("Una MADRE
   limpia…") o como "MADRE: texto".                                           */
function personajesLibres(b){
  const out=[];
  b.split('\n').forEach(l=>{
    const m = l.match(/^\s*([A-ZÁÉÍÓÚÑÜ][A-ZÁÉÍÓÚÑÜ\s\.']{1,30}?)\s*[:：]\s*\S/);
    if(m){ const nom=m[1].trim(); if(!NO_PERSONAJE.has(nom) && nom.length>1 && !out.includes(nom)) out.push(nom); }
  });
  (b.match(/\b[A-ZÁÉÍÓÚÑÜ]{3,}(?:\s+[A-ZÁÉÍÓÚÑÜ]{3,})?\b/g)||[]).forEach(w=>{
    const nom=w.trim();
    if(NO_PERSONAJE.has(nom) || out.includes(nom)) return;
    if(nom.split(/\s+/).some(x=>NO_PERSONAJE.has(x))) return;
    if(LUGARES.INT.includes(norm(nom)) || LUGARES.EXT.includes(norm(nom))) return;
    out.push(nom);
  });
  return out;
}

/* Punto de entrada único: usa encabezados si los hay, si no corta por párrafo.
   Devuelve también en qué modo leyó, para poder decírselo a la persona.      */
function desglosar(txt){
  const conEnc = parseGuion(txt);
  if(conEnc.length) return {escenas:conEnc, modo:'encabezados'};
  const libres = parseGuionLibre(txt);
  return {escenas:libres, modo: libres.length>1 ? 'parrafos' : libres.length ? 'bloque' : 'nada'};
}

/* Sugiere elementos por diccionario. Marca lo detectado en `auto` para poder
   distinguir lo propuesto por la máquina de lo confirmado por una persona.   */
function detectar(e){
  const t = ' ' + norm(e.texto).replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ') + ' ';
  Object.entries(DICC).forEach(([dep, palabras])=>{
    const hall = [];
    palabras.forEach(p=>{ if(t.includes(' '+norm(p)+' ')) hall.push(p); });
    if(hall.length){
      e.elementos[dep] = [...new Set([...(e.elementos[dep]||[]), ...hall])];
      e.auto[dep] = hall;
    }
  });
}

/* Resúmenes ---------------------------------------------------------------- */
const octavosATexto = o => { const p=Math.floor(o/8), r=o%8;
  return (p?p:'') + (p&&r?' ':'') + (r?r+'/8':(p?'':'0')); };

function resumenDesglose(d){
  const esc = d.escenas;
  const octavos = esc.reduce((s,e)=>s+e.octavos,0);
  const pers = new Set(), locs = new Set(), porDepto = {};
  esc.forEach(e=>{
    e.personajes.forEach(p=>pers.add(p));
    locs.add(e.locacion);
    Object.entries(e.elementos).forEach(([k,v])=>{
      porDepto[k] ||= new Map();
      v.forEach(x=>{ const key=norm(x);
        if(!porDepto[k].has(key)) porDepto[k].set(key,{nombre:x, escenas:[]});
        porDepto[k].get(key).escenas.push(e.numero); });
    });
  });
  const paginas = octavos/8;
  return {escenas:esc.length, octavos, paginas, personajes:[...pers].sort(), locaciones:[...locs].sort(),
    porDepto, jornadasEstimadas: Math.max(1, Math.ceil(paginas / Math.max(0.125, d.paginasPorJornada))),
    noches: esc.filter(e=>/NOCHE|NIGHT|MADRUGADA/.test(e.momento)).length,
    ext: esc.filter(e=>e.intExt!=='INT').length};
}

  return pr.proyectos.find(p=>p.id===DB.ui.proyectoId) || pr.proyectos[0] || null; };

  return py.versiones.find(v=>v.id===DB.ui.versionId) || py.versiones[0] || null; };

/* ===========================  CALC  ======================================= */

const n = x => { const v = parseFloat(String(x??'').replace(',','.')); return isFinite(v)?v:0; };

/* tc = unidades de ARS por 1 USD */
function conv(monto, de, a, tc){
  if(de===a) return monto;
  if(de==='USD' && a==='ARS') return monto * tc;
  if(de==='ARS' && a==='USD') return tc ? monto / tc : 0;
  return monto;
}
function totalLinea(l, v){
  const bruto = n(l.cantidad) * n(l.dias) * n(l.valorUnit);
  return conv(bruto, l.moneda||'ARS', v.monedaBase, n(v.tc));
}
function totalRubro(r, v){ return r.lineas.reduce((s,l)=>s+totalLinea(l,v), 0); }

/* Motor: subtotal → fee → contingencia → IIBB → IVA → total.
   El fee sólo se aplica sobre los rubros marcados aplicaFee (el elenco y los
   seguros normalmente se pasan a costo, sin fee).                            */
function calcular(v){
  let subtotal=0, baseFee=0;
  const porRubro = v.rubros.map(r=>{
    const t = totalRubro(r,v);
    subtotal += t; if(r.aplicaFee) baseFee += t;
    return {id:r.id, codigo:r.codigo, nombre:r.nombre, total:t, lineas:r.lineas.length};
  });
  const c = v.capas;
  const fee          = baseFee  * n(c.fee)/100;
  const contingencia = subtotal * n(c.contingencia)/100;
  const netoPrevio   = subtotal + fee + contingencia;
  const iibb         = netoPrevio * n(c.iibb)/100;
  const neto         = netoPrevio + iibb;
  const iva          = neto * n(c.iva)/100;
  const total        = neto + iva;
  return {porRubro, subtotal, baseFee, fee, contingencia, iibb, neto, iva, total};
}

/* Exposición documental: cuánto del costo directo tiene respaldo fiscal.     */
function exposicion(v){
  const r = {facturado:0, parcial:0, sinRespaldo:0, sinDefinir:0,
             bancario:0, efectivo:0, otro:0, total:0};
  v.rubros.forEach(rb=>rb.lineas.forEach(l=>{
    const t = totalLinea(l,v); r.total += t;
    const kc = (CIRCUITOS.find(c=>c.v===(l.circuito||''))||{}).k;
    if(kc==='ban') r.bancario+=t; else if(kc==='efe') r.efectivo+=t; else r.otro+=t;
    const kd = (COMPROBANTES.find(c=>c.v===(l.comprobante||''))||{}).k;
    if(!l.comprobante) r.sinDefinir+=t;
    else if(kd==='si') r.facturado+=t;
    else if(kd==='par') r.parcial+=t;
    else r.sinRespaldo+=t;
  }));
  return r;
}

const fmt = (x, mon='ARS') => (mon==='USD'?'US$ ':'$ ') +
  Math.round(n(x)).toLocaleString('es-AR');
const fmtC = x => Math.round(n(x)).toLocaleString('es-AR');
const esc  = s => String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pct  = (p,t) => t ? Math.round(p/t*100) : 0;

/* Devuelve el cartel de estado que va abajo del textarea. Se actualiza en vivo
   mientras se pega, así no hace falta adivinar si el guion se entiende.      */
function infoGuion(txt){
  if(!txt || !txt.trim())
    return `<span class="muted">Pegá el guion acá. Si tiene encabezados los uso; si no —como la mayoría
      de los guiones de publicidad— separo por párrafo e infiero la locación del texto.</span>`;
  const {escenas:es, modo} = desglosar(txt);
  if(!es.length) return `<span class="gmal">✕ No encuentro nada para desglosar.</span>`;
  const locs = new Set(es.map(e=>e.locacion));
  const pers = new Set(es.flatMap(e=>e.personajes));
  const oct = es.reduce((s,e)=>s+e.octavos,0);
  const cuantos = modo==='encabezados' ? `${es.length} escena${es.length==1?'':'s'}`
                                       : `${es.length} bloque${es.length==1?'':'s'}`;
  const aviso = modo==='encabezados'
    ? `<span class="muted">· leído por encabezados</span>`
    : modo==='bloque'
      ? `<span class="gaviso">· sin encabezados y sin cortes claros: va a quedar todo en una escena, la partís después</span>`
      : `<span class="gaviso">· sin encabezados: separo por párrafo e infiero la locación — revisalo después</span>`;
  return `<span class="gbien">✓ ${cuantos}</span>
    <span class="muted">· ${locs.size} ${locs.size==1?'locación':'locaciones'} · ${pers.size} personaje${pers.size==1?'':'s'}
    · ${octavosATexto(oct)} páginas</span> ${aviso}
    <b style="color:var(--ac)">— tocá “Desglosar”</b>`;
}

/* En vivo: guarda lo tipeado en el modelo (para que no se pierda si algo
   redibuja) y actualiza el cartel sin re-renderizar, que perdería el foco.   */
let _gt;
function guionInput(el){
  getD().guion = el.value;
  clearTimeout(_gt);
  _gt = setTimeout(()=>{
    const info = document.getElementById('ginfo');
    if(info) info.innerHTML = infoGuion(el.value);
    guardar();
  }, 220);
}

      <span class="emom ${/NOCHE|NIGHT|MADRUGADA/.test(e.momento)?'noche':''}">${esc(e.momento)}</span>
      <span class="epg">${octavosATexto(e.octavos)} pg</span>
      <span class="muted" style="font-size:11px">${e.personajes.join(', ')||'—'}</span>
      <span class="jda noprint"><select onchange="setJornada('${e.id}',this.value)">
        <option value="">—</option>
        ${Array.from({length:Math.max(nums.length+1,8)},(_,i)=>i+1).map(nn=>
          `<option value="${nn}" ${e.jornada===nn?'selected':''}>J${nn}</option>`).join('')}
      </select></span></div>`;
  const bloque = (titulo, lista, cls='') => {
    const oct = lista.reduce((s,e)=>s+e.octavos,0);
    const locs = [...new Set(lista.map(e=>e.locacion))];
    return `<div class="jhead ${cls}"><b>${titulo}</b>
      <span class="muted" style="font-size:11.5px">${lista.length} esc · ${octavosATexto(oct)} pg · ${locs.length} loc${locs.length==1?'':'s'}</span>
      <div class="spacer" style="flex:1"></div>
      <span class="muted" style="font-size:11px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(locs.join(' · '))}</span>
    </div>${lista.map(linea).join('')}`;
  };
  return `<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:4px" class="noprint">
      <span class="muted" style="font-size:11.5px">Páginas por jornada</span>
      <input type="number" step="any" min="0.125" value="${d.paginasPorJornada}" style="width:64px"
        onchange="setPagJornada(this.value)">
      <span class="muted" style="font-size:11.5px">→ ${r.jornadasEstimadas} jornada${r.jornadasEstimadas==1?'':'s'} estimada${r.jornadasEstimadas==1?'':'s'}</span>
      <div style="flex:1"></div>
      <button class="btn sm pri" onclick="autoAgrupar()">Auto-agrupar por locación</button>
      <button class="btn sm" onclick="limpiarJornadas()">Desasignar todo</button>
    </div>
    ${nums.map(nn=>bloque('Jornada '+nn, asignadas[nn])).join('')}
    ${sin.length?bloque('Sin asignar', sin, 'sinasig'):''}
    ${!nums.length&&!sin.length?'<div class="empty">Sin escenas</div>':''}`;
}

/* ---------- portada: resumen del proyecto ----------
   Lo primero que se ve al abrir. Contesta dos preguntas: cómo viene la plata
   y qué está esperando algo de mí.                                           */
function vistaResumen(pr,py,v){
  const u = getUsuario();
  const P = resumenPlata(py, v);
  const cs = getComprobantes();
  const d = py.desglose || nuevoDesglose();
  const cfg = (py.configRodaje ||= nuevaConfigRodaje());
  const R = v ? calcular(v) : null;

  /* qué hay pendiente */
  const pend = [];
  const mios = u ? cs.filter(c=>accionesDe(c,u).length) : [];
  if(mios.length){
    const QUE = {revisar:'para revisar', aprobar:'para aprobar', pagar:'para pagar'};
    /* si esperan cosas distintas, se dice genérico */
    const sigs = [...new Set(mios.map(c=>EST(c.estado).sig).filter(Boolean))];
    const que = sigs.length===1 ? (QUE[sigs[0]]||'esperándote') : 'esperándote';
    pend.push({n:mios.length, t:`comprobante${mios.length==1?'':'s'} ${que}`,
      ir:"setTab('gastos');setSubGasto('bandeja')", urg:true});
  }
  const cajasAb = getCajas().filter(x=>x.estado==='abierta');
  if(cajasAb.length){ const enMano = cajasAb.reduce((s,x)=>s+saldoCaja(py,x).saldo, 0);
    pend.push({n:cajasAb.length, t:`caja${cajasAb.length==1?'':'s'} sin rendir · ${fmt(enMano)} en mano`,
      ir:"setTab('gastos');setSubGasto('caja')"}); }
  const ocBorr = getOCs().filter(o=>o.estado==='borrador');
  if(ocBorr.length) pend.push({n:ocBorr.length, t:`orden${ocBorr.length==1?'':'es'} de compra sin emitir`,
    ir:"setTab('gastos');setSubGasto('oc')"});
  const sinRubro = cs.filter(c=>!c.rubro).length;
  if(sinRubro) pend.push({n:sinRubro, t:'comprobantes sin rubro', ir:"setTab('gastos');setSubGasto('todos')", urg:true});
  /* citaciones de la próxima jornada sin avisar */
  const prox = d.jornadas.find(j=>{ normalizarJornada(j);
    return Object.keys(j.parte.citados||{}).filter(k=>j.parte.citados[k]).length <
           gentePorJornada(py,v,j.numero).gente.length; });
  if(prox){ const g = gentePorJornada(py,v,prox.numero).gente;
    const falta = g.length - Object.keys(prox.parte.citados||{}).filter(k=>prox.parte.citados[k]).length;
    if(falta) pend.push({n:falta, t:`sin citar para la jornada ${prox.numero}`,
      ir:`DB.ui.jornada=${prox.numero};setTab('rodaje');setSubRodaje('citaciones')`}); }
  const sinDatos = armarContactos(py, v).sinDatos;
  if(sinDatos) pend.push({n:sinDatos, t:'contactos sin teléfono ni mail',
    ir:"setTab('callsheet');setSubCall('contactos')"});

  /* horas extra acumuladas */
  const HE = d.jornadas.length ? horasProyecto(py, v, cfg) : {totalExtra:0, totalARS:0};
  const filmadas = d.escenas.filter(e=>d.jornadas.some(j=>(j.parte?.filmadas||[]).includes(e.id))).length;
  const octT = d.escenas.reduce((s,e)=>s+e.octavos,0);

  const dato = (val,l,col) => `<div><b${col?` style="color:${col}"`:''}>${val}</b><span>${esc(l)}</span></div>`;
  const bloque = (t,c,extra='') => `<div class="csblock"><h4>${esc(t)}${extra}</h4>${c}</div>`;

  return `<div class="cs">
    <div class="cshead">
      <div><div class="csttl">${esc(py.nombre)}</div>
        <div class="cssub">${esc(pr.nombre)}${py.cliente?' · '+esc(py.cliente):''}${py.agencia?' · '+esc(py.agencia):''}
          · ${py.jornadas} jornada${py.jornadas==1?'':'s'}${py.tipo?' · '+esc(py.tipo):''}</div></div>
      <div style="text-align:right">
        <div class="csj">${R?fmt(R.total, v.monedaBase):'—'}</div>
        <div class="cssub">presupuesto ${esc(v?v.nombre:'')} · ${esc(v?v.estado:'')}</div></div>
    </div>

    <div class="cshoras">
      ${dato(fmt(P.presu,P.base), 'Costo directo')}
      ${dato(fmt(P.comp,P.base), 'Comprometido', 'var(--ac)')}
      ${dato(fmt(P.real,P.base), 'Real cargado')}
      ${dato(fmt(P.pagado,P.base), 'Pagado', 'var(--ok)')}
      ${dato(fmt(P.disponible,P.base), 'Disponible', P.disponible<0?'var(--bad)':'var(--ac)')}
    </div>

    ${pend.length ? bloque('Esperan algo', `<div class="pad" style="display:flex;flex-direction:column;gap:1px">
      ${pend.map(x=>`<button class="pendfila ${x.urg?'urg':''}" onclick="${x.ir}">
        <span class="pendn">${x.n}</span><span>${esc(x.t)}</span><span class="pendir">→</span></button>`).join('')}
    </div>`) : bloque('Esperan algo', `<div class="pad muted" style="font-size:12.5px">
      Nada pendiente. ${u?'':'Cargá el equipo para que aparezcan las bandejas.'}</div>`)}

    ${bloque('El proyecto', `<div class="pad grid2" style="gap:14px">
      <div>
        <div class="resl">Guion y desglose</div>
        ${d.escenas.length
          ? `<div class="resd">${d.escenas.length} escenas · ${octavosATexto(octT)} páginas ·
             ${new Set(d.escenas.map(e=>e.locacion)).size} locaciones ·
             ${new Set(d.escenas.flatMap(e=>e.personajes)).size} personajes</div>
             <div class="resd muted">${filmadas} escena${filmadas==1?'':'s'} marcada${filmadas==1?'':'s'} como filmada${filmadas==1?'':'s'}</div>`
          : `<div class="resd muted">Sin guion cargado</div>`}
        <button class="btn sm" onclick="setTab('desglose')" style="margin-top:6px">Ir al desglose</button>
      </div>
      <div>
        <div class="resl">Rodaje</div>
        ${d.jornadas.length
          ? `<div class="resd">${d.jornadas.length} jornada${d.jornadas.length==1?'':'s'} planificada${d.jornadas.length==1?'':'s'}</div>
             <div class="resd ${HE.totalExtra?'':'muted'}">Horas extra acumuladas: <b>${fmtHoras(HE.totalExtra)}</b>${HE.totalARS?' · '+fmt(HE.totalARS):''}</div>
             <div class="resd muted">Jornada base ${cfg.horasJornada} h · extras +${cfg.recargoHE}%</div>`
          : `<div class="resd muted">Sin plan de rodaje</div>`}
        <button class="btn sm" onclick="setTab('rodaje')" style="margin-top:6px">Ir al rodaje</button>
      </div>
      <div>
        <div class="resl">Gastos</div>
        <div class="resd">${cs.length} comprobante${cs.length==1?'':'s'} ·
          ${cs.filter(c=>c.estado==='pagado').length} pagado${cs.filter(c=>c.estado==='pagado').length==1?'':'s'}</div>
        <div class="resd muted">${getOCs().length} orden${getOCs().length==1?'':'es'} de compra ·
          ${getCajas().length} caja${getCajas().length==1?'':'s'}</div>
        <button class="btn sm" onclick="setTab('gastos')" style="margin-top:6px">Ir a gastos</button>
      </div>
      <div>
        <div class="resl">Equipo</div>
        <div class="resd">${(pr.usuarios||[]).filter(x=>x.activo).length} persona(s) con acceso ·
          ${DB.catalogo.personas.length} en el catálogo</div>
        <div class="resd muted">${u?'Estás como <b>'+esc(u.nombre)+'</b> · '+esc(ROL(u.rol).l):'Sin sesión'}</div>
        <button class="btn sm" onclick="setTab('equipo')" style="margin-top:6px">Ir al equipo</button>
      </div>
    </div>`)}

    ${P.filas.some(f=>f.disponible<0) ? bloque('Rubros pasados de presupuesto',
      `<div class="scrollx"><table class="tbl cst"><thead><tr><th style="width:44px">Cód.</th><th>Rubro</th>
        <th style="width:118px;text-align:right">Presupuestado</th>
        <th style="width:118px;text-align:right">Comprometido + real</th>
        <th style="width:112px;text-align:right">Se pasó</th></tr></thead>
        <tbody>${P.filas.filter(f=>f.disponible<0).map(f=>`<tr class="conhe">
          <td><span class="rcode">${esc(f.codigo)}</span></td><td>${esc(f.nombre)}</td>
          <td class="num" style="text-align:right">${fmt(f.presu,P.base)}</td>
          <td class="num" style="text-align:right">${fmt(f.comp+f.real,P.base)}</td>
          <td class="num" style="text-align:right"><b>${fmt(-f.disponible,P.base)}</b></td></tr>`).join('')}
        </tbody></table></div>`) : ''}

    <div class="csfoot">${esc(pr.nombre)} · ${esc(py.nombre)} · resumen al ${hoy()}</div>
  </div>`;
}

/* ---------- vista gastos ---------- */
function vistaGastos(pr,py,v){
  const u = getUsuario();
  if(!u) return `<div class="card"><div class="empty">
    Todavía no hay nadie cargado en el equipo de <b>${esc(pr.nombre)}</b>.<br>
    <span style="font-size:12px">Los comprobantes los carga cada departamento, así que primero
    hay que dar de alta a la gente y decir qué rol tiene cada uno.</span><br><br>
    <button class="btn pri" onclick="setTab('equipo')">Cargar el equipo</button></div></div>`;

  const cs = getComprobantes();
  const R = resumenGastos(py, v);
  const sub = DB.ui.subGasto || 'bandeja';
  const pend = cs.filter(c=>accionesDe(c,u).length);
  const mios = cs.filter(c=>c.cargadoPor===u.id);
  const abiertas = getCajas().filter(x=>x.estado==='abierta').length;
  const S = [['bandeja',`Mi bandeja${pend.length?' · '+pend.length:''}`],
             ['todos',`Comprobantes · ${cs.length}`],
             ['oc',`Órdenes de compra${getOCs().length?' · '+getOCs().length:''}`],
             ['caja',`Caja chica${abiertas?' · '+abiertas:''}`],
             ['control','Tablero']];
  let lista = sub==='bandeja' ? (puede(u,'revisar') ? pend : mios) : cs;
  /* filtros: administración necesita ver "todas las facturas de arte" */
  const F = DB.ui.fGasto || {rubro:'', estado:'', q:''};
  if(sub!=='bandeja'){
    if(F.rubro)  lista = lista.filter(c=>c.rubro===F.rubro);
    if(F.estado) lista = lista.filter(c=>c.estado===F.estado);
    if(F.q){ const q = norm(F.q);
      lista = lista.filter(c=>[c.proveedor,c.subrubro,c.concepto,c.numero,c.cuit]
        .some(x=>norm(x||'').includes(q))); }
  }
  const nuevo = {bandeja:['+ Cargar comprobante','cargarComprobante()'],
                 todos:['+ Cargar comprobante','cargarComprobante()'],
                 oc:['+ Nueva orden de compra','editOC()'],
                 caja:['+ Abrir caja chica','editCaja()'],
                 control:['+ Cargar comprobante','cargarComprobante()']}[sub];

  return `<div class="noprint" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <div class="seg">${S.map(([k,l])=>
        `<button class="${sub===k?'on':''}" onclick="setSubGasto('${k}')">${l}</button>`).join('')}</div>
      <div style="flex:1"></div>
      <button class="btn pri" onclick="${nuevo[1]}">${nuevo[0]}</button>
    </div>
    ${sub==='control' ? tableroHTML(py,v)
    : sub==='oc'      ? ocsHTML(py,v,u)
    : sub==='caja'    ? cajasHTML(py,v,u,pr)
                      : bandejaHTML(lista, u, R, sub, pr, py, v, cs)}`;
}

/* --- órdenes de compra --------------------------------------------------- */

  const ocs = getOCs();
  const base = v?v.monedaBase:'ARS', tc = v?n(v.tc):1000;
  const comp = ocs.reduce((s,o)=>s+comprometidoDeOC(py,o,base,tc), 0);
  return `<div class="cs">
    <div class="cshead">
      <div><div class="csttl">Órdenes de compra</div>
        <div class="cssub">Lo que ya se cerró con proveedores y todavía no llegó facturado</div></div>
      <div style="text-align:right"><div class="csj">${fmt(comp,base)}</div>
        <div class="cssub">comprometido sin facturar</div></div>
    </div>
    <div class="pad muted" style="font-size:12px;line-height:1.55;border-bottom:1px solid var(--line)">
      Una OC reserva plata del presupuesto en el momento en que cerrás el trato, no cuando
      llega la factura. A medida que llegan comprobantes imputados a la OC, el comprometido baja
      y el real sube: la misma plata no se cuenta dos veces.
    </div>
    <div class="scrollx"><table class="tbl cst">
      <thead><tr><th style="width:82px">Estado</th><th style="width:88px">Número</th>
        <th>Concepto</th><th style="width:18%">Proveedor</th><th style="width:48px">Rubro</th>
        <th style="width:110px;text-align:right">Importe</th>
        <th style="width:110px;text-align:right">Facturado</th>
        <th class="noprint">Acciones</th></tr></thead>
      <tbody>${ocs.map(o=>{
        const e = EST_OC(o.estado);
        const fac = facturadoDeOC(py, o.id, base, tc);
        const tot = conv(n(o.importe), o.moneda, base, tc);
        return `<tr>
          <td><span class="est" style="color:${e.c};border-color:${e.c}55;background:${e.c}18">${e.l}</span></td>
          <td class="mono" style="font-size:11.5px">${esc(o.numero)}</td>
          <td><b>${esc(o.subrubro||o.concepto||'—')}</b>
            ${o.concepto&&o.subrubro?`<span class="muted" style="display:block;font-size:10.5px">${esc(o.concepto)}</span>`:''}</td>
          <td class="muted">${esc(o.proveedor||'—')}</td>
          <td><span class="rcode">${esc(o.rubro)}</span></td>
          <td class="num" style="text-align:right"><b>${fmt(o.importe,o.moneda)}</b></td>
          <td class="num" style="text-align:right">${fac?`<span style="color:${fac>=tot-1?'var(--ok)':'var(--warn)'}">${fmt(fac,base)}</span>`:'<span class="muted">—</span>'}</td>
          <td class="noprint" style="white-space:nowrap">
            ${o.estado==='borrador'&&puede(u,'aprobar')?`<button class="btn sm pri" onclick="emitirOC('${o.id}')">Emitir</button>`:''}
            ${o.estado==='emitida'&&puede(u,'revisar')?`<button class="btn sm" onclick="cerrarOC('${o.id}')">Dar por cumplida</button>`:''}
            <button class="btn sm" onclick="editOC('${o.id}')">Editar</button>
            <button class="btn sm dgr" onclick="delOC('${o.id}')">×</button></td>
        </tr>`;}).join('') || '<tr><td colspan="8" class="empty">Sin órdenes de compra</td></tr>'}
      </tbody></table></div></div>`;
}

/* --- tablero de plata ---------------------------------------------------- */
function tableroHTML(py,v){
  const P = resumenPlata(py, v);
  const filas = P.filas.filter(f=>f.presu || f.comp || f.real);
  const barra = f => {
    const tot = Math.max(f.presu, f.comp+f.real) || 1;
    const pr0 = f.real/tot*100, pc = f.comp/tot*100;
    return `<span class="barra barra2" title="real ${Math.round(f.real/ (f.presu||1) *100)}% del presupuesto">
      <i style="width:${pr0}%;background:${f.desvio>0?'var(--bad)':'var(--ok)'}"></i>
      <i style="width:${pc}%;background:var(--ac);opacity:.6"></i></span>`;
  };
