function bandejaHTML(lista, u, R, sub, pr, py, v, todos){

/* Pensada para que un asistente de producción la use en el set, con el celu
   en la mano: citar, fichar entradas y salidas, y anotar lo que pasó.        */
function vistaRodaje(pr,py,v){
  const d = py.desglose;
  if(!d.jornadas.length) return `<div class="card"><div class="empty">
    Todavía no hay jornadas.<br><span style="font-size:12px">Armá el plan en

    <button class="btn pri" onclick="setTab('desglose');setSub('plan')">Ir al plan de rodaje</button></div></div>`;

  const num = d.jornadas.some(x=>x.numero===DB.ui.jornada) ? DB.ui.jornada : d.jornadas[0].numero;
  DB.ui.jornada = num;
  const j = normalizarJornada(d.jornadas.find(x=>x.numero===num));
  j.parte ||= nuevoParte();
  py.configRodaje ||= nuevaConfigRodaje();
  const cfg = py.configRodaje;
  const {gente, callsheet:C} = gentePorJornada(py, v, num);
  const sub = DB.ui.subRodaje || 'citaciones';
  const S = [['citaciones','Citaciones'],['parte','Parte del día'],['horas','Horas y extras']];

  return `<div class="noprint" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">

      <button class="btn" onclick="cfgRodaje()">Condiciones ⚙</button>

}

/* Acumulado de horas extra de todo el rodaje. */
function horasProyecto(py, v, cfg){
  const out = {jornadas:[], totalExtra:0, totalARS:0};
  (py.desglose?.jornadas||[]).forEach(jj=>{
    normalizarJornada(jj); jj.parte ||= nuevoParte();
    const {gente} = gentePorJornada(py, v, jj.numero);
    let extra=0, costoARS=0, fichados=0;
    gente.forEach(g=>{
      const h = horasDe(g.clave, jj, cfg, g.valorJornada, g.moneda);
      if(h.sinDatos) return;
      fichados++; extra += h.extra;
      if(g.moneda==='ARS') costoARS += h.costoHE;
    });
    out.jornadas.push({numero:jj.numero, fecha:jj.fecha, fichados, extra, costoARS});
    out.totalExtra += extra; out.totalARS += costoARS;
  });
  return out;
}
/* Descanso entre el wrap de una jornada y la citación de la siguiente. */
function turnaround(py, j, cfg){
  const js = py.desglose.jornadas;
  const sig = js.find(x=>x.numero===j.numero+1);
  if(!sig || !j.parte?.wrap || !sig.citacion) return null;
  let min = lapso(j.parte.wrap, sig.citacion);
  if(min==null) return null;
  /* si las fechas son consecutivas el lapso ya cruza la medianoche */
  return {siguiente:sig.numero, minutos:min, corto: min < n(cfg.minTurnaround)*60};
}

function bloqueCS(titulo, contenido, cls=''){
  return `<div class="csblock ${cls}"><h4>${esc(titulo)}</h4>${contenido}</div>`;

function diaSemana(f){
  const D=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const p=String(f).split('-'); if(p.length!==3) return '';
  return D[new Date(+p[0],+p[1]-1,+p[2]).getDay()]||'';
}

/* Une con la anterior: junta textos, personajes y elementos sin duplicar.    */
function unirEscena(id){
  const d = getD(); const i = d.escenas.findIndex(x=>x.id===id);
  if(i<=0){ toast('Esta es la primera escena'); return; }
  const a = d.escenas[i-1], b = d.escenas[i];
  a.texto = (a.texto.trimEnd() + '\n\n' + b.texto.trim()).trim();
  a.octavos += b.octavos;
  b.personajes.forEach(p=>{ if(!a.personajes.includes(p)) a.personajes.push(p); });
  Object.entries(b.elementos).forEach(([k,v])=>{
    a.elementos[k] = [...new Set([...(a.elementos[k]||[]), ...v])]; });
  if(b.notas) a.notas = (a.notas ? a.notas+' · ' : '') + b.notas;
  d.escenas.splice(i,1);
  renumerar(d); sincronizarJornadas(d); toast('Escenas unidas'); R();
}

function dividirEscena(id){
  const e = getD().escenas.find(x=>x.id===id);
  const ls = e.texto.split('\n');
  if(ls.filter(x=>x.trim()).length<2){ toast('Esta escena tiene una sola línea'); return; }
  abrir(`<div class="ov" onclick="if(event.target===this)cerrar()"><div class="mod">

        Tocá el renglón donde <b>arranca la escena nueva</b>. Lo de arriba queda en la ${esc(e.numero)}.</div>
      ${ls.map((l,i)=> i===0 || !l.trim() ? '' :
        `<button class="btn lineadiv" onclick="hacerDivision('${e.id}',${i})">${esc(l.trim())}</button>`).join('')}
    </div><div class="mfoot"><button class="btn" onclick="cerrar()">Cancelar</button></div>
  </div></div>`);

function hacerDivision(id, i){
  const d = getD(); const idx = d.escenas.findIndex(x=>x.id===id); const e = d.escenas[idx];
  const ls = e.texto.split('\n');
  const arriba = ls.slice(0,i).join('\n').trim();
  const abajo  = ls.slice(i).join('\n').trim();
  if(!arriba || !abajo){ cerrar(); toast('No hay dónde cortar'); return; }
  const nueva = nuevaEscena({numero:e.numero+'A', intExt:e.intExt, locacion:e.locacion,
    momento:e.momento, texto:abajo, abierta:true,
    octavos: Math.max(1, Math.round(e.octavos * abajo.length / (arriba.length+abajo.length)))});
  nueva.personajes = personajesLibres(abajo);
  detectar(nueva);
  e.texto = arriba;
  e.octavos = Math.max(1, e.octavos - nueva.octavos);
  e.personajes = personajesLibres(arriba).length ? personajesLibres(arriba) : e.personajes;
  e.elementos = {}; e.auto = {}; detectar(e);
  d.escenas.splice(idx+1, 0, nueva);
  renumerar(d); cerrar(); toast('Escena dividida'); R();
}
/* Renumera 1..N sólo si la numeración original era correlativa simple.       */
function renumerar(d){
  const simple = d.escenas.every(e=>/^\d+[A-Z]?$/.test(String(e.numero)));
  if(!simple) return;
  d.escenas.forEach((e,i)=>e.numero = String(i+1));
}

/* Vuelve a pasar el diccionario conservando lo agregado a mano: sólo se
   descartan las sugerencias viejas que ya no aparecen.                       */
function reDetectar(){
  const d=getD(); let nuevos=0;
  d.escenas.forEach(e=>{
    const manual = {};
    Object.entries(e.elementos).forEach(([k,v])=>{
      const auto = e.auto[k]||[];
      const m = v.filter(x=>!auto.includes(x));
      if(m.length) manual[k]=m;
    });
    const antes = Object.values(e.elementos).reduce((s,v)=>s+v.length,0);
    e.elementos = {...manual}; e.auto = {};
    detectar(e);
    nuevos += Math.max(0, Object.values(e.elementos).reduce((s,v)=>s+v.length,0) - antes);
  });
  toast(nuevos?`+${nuevos} elemento(s) nuevo(s)`:'Sin cambios'); R();
}

/* Auto-agrupa: ordena por locación + INT/EXT + momento (así no se salta de un
   lado a otro ni se mezcla día con noche) y llena jornadas hasta el tope de
   páginas. Es un punto de partida, no un plan final.                         */
function autoAgrupar(){
  const d=getD();
  const tope = d.paginasPorJornada*8;
  const orden = [...d.escenas].sort((a,b)=>
    a.locacion.localeCompare(b.locacion) || a.intExt.localeCompare(b.intExt) ||
    a.momento.localeCompare(b.momento) || String(a.numero).localeCompare(String(b.numero),undefined,{numeric:true}));
  let j=1, acum=0;
  orden.forEach(e=>{
    if(acum && acum+e.octavos>tope){ j++; acum=0; }
    e.jornada=j; acum+=e.octavos;
  });
  sincronizarJornadas(d);
  toast(`Agrupado en ${j} jornada${j==1?'':'s'}`); R();
}
function sincronizarJornadas(d){
  const max = d.escenas.reduce((m,e)=>Math.max(m, e.jornada||0), 0);
  d.jornadas = Array.from({length:max},(_,i)=>d.jornadas[i] || nuevaJornada({numero:i+1}));
  d.jornadas.forEach((j,i)=>{ j.numero=i+1; normalizarJornada(j); });
}
/* Completa los campos que falten. Las jornadas guardadas por una versión
   anterior sólo tenían id/numero/fecha/notas: sin esto el callsheet las
   muestra vacías. Se aplica en todos los caminos de entrada.                 */
function normalizarJornada(j){
  const base = nuevaJornada({numero:j.numero});
  for(const k in base) if(j[k]===undefined || j[k]===null) j[k] = base[k];
  j.parte ||= nuevoParte();
  j.parte.fichadas ||= {}; j.parte.citados ||= {}; j.parte.filmadas ||= [];
  return j;
}

  const d = datos(); const py = getPy(); const u = getUsuario();
  py.comprobantes ||= [];

  Object.assign(c, {rubro:d.rubro, subrubro:d.subrubro, concepto:d.concepto,

    ocId: d.ocId || null, cajaId: d.cajaId || null});
  if(_adjTmp){ c.adjunto = _adjTmp; _adjTmp = null; }
  /* Si va contra una OC, los datos salen de ahí: el rubro ya lo decidió quien
     emitió la orden. Va ANTES de validar, si no pide algo que ya está.       */
  if(c.ocId){

/* Fichar de una: la entrada de cada uno es su citación; la salida, el wrap.
   Es el 90% de los casos; después se corrigen las excepciones a mano.        */
function ficharTodos(campo){
  const py=getPy(), v=getV(), j=jornadaParte();
  const {gente} = gentePorJornada(py, v, j.numero);
  let n0=0;
  gente.forEach(g=>{
    const val = campo==='entrada' ? ((j.citaciones[g.clave]||{}).citacion || j.citacion) : j.parte.wrap;
    if(!val) return;
    j.parte.fichadas[g.clave] ||= {};
    if(!j.parte.fichadas[g.clave][campo]){ j.parte.fichadas[g.clave][campo] = val; n0++; }
  });
  toast(n0 ? `${n0} ${campo}s cargadas` : (campo==='salida'&&!j.parte.wrap ? 'Cargá primero el wrap' : 'Ya estaban cargadas'));
  R();
}

  const j = jornadaParte();
  j.parte.citados ||= {};
  j.parte.citados[clave] = val===undefined ? true : !!val;
  guardar();
  if(val!==undefined) R();

  const py=getPy(), j=jornadaParte();
  const {gente} = gentePorJornada(py, getV(), j.numero);

  const pr=getPr(), py=getPy(), j=jornadaParte();
  const {gente, callsheet:C} = gentePorJornada(py, getV(), j.numero);
  const p = gente.find(x=>x.clave===clave); if(!p) return;
  alPortapapeles(textoCitacion(pr,py,j,C,p,cfgActual()), 'Citación copiada');
  marcarCitado(clave);
}

  const pr=getPr(), py=getPy(), j=jornadaParte();

  const cfg = cfgActual();
  const txt = gente.map(p=>textoCitacion(pr,py,j,C,p,cfg)).join('\n\n' + '─'.repeat(28) + '\n\n');
  alPortapapeles(txt, `${gente.length} citaciones copiadas`);

/* ---------- lista de contactos ---------- */
function setSubCall(k){ DB.ui.subCall = k; R(); }
const getC = () => { const py=getPy();
  py.contactos ||= {porLinea:{}, extra:[]};
  py.contactos.porLinea ||= {}; py.contactos.extra ||= [];
  return py.contactos; };

/* Si el contacto está enlazado al catálogo se escribe ahí: un solo lugar para
   el teléfono de cada persona, sirva en el proyecto que sirva.               */
function upContacto(clave, campo, val){
  const C = getC();
  if(clave.startsWith('x:')){
    const ct = C.extra.find(x=>x.id===clave.slice(2));
    if(ct){ ct[campo]=val; R(); }
    return;
  }
  if(clave.startsWith('l:')){
    const l = lineaPorId(clave.slice(2));
    if(l && l.refId){
      const pe = DB.catalogo.personas.find(x=>x.id===l.refId);
      if(pe){ pe[campo]=val; R(); return; }
    }
  }
  C.porLinea[clave] ||= {};
  C.porLinea[clave][campo] = val;
  R();
}
function lineaPorId(id){
  for(const v of (getPy()?.versiones||[]))
    for(const r of v.rubros){ const l = r.lineas.find(x=>x.id===id); if(l) return l; }
  return null;
}
function addContacto(grupo){
  getC().extra.push(nuevoContacto({grupo}));
  toast('Contacto agregado — cargale el nombre'); R();
}
function delContacto(id){
  const C = getC(); C.extra = C.extra.filter(x=>x.id!==id); R();
}
/* Guardar en el catálogo lo cargado a mano, para reusarlo en otros proyectos */
function aCatalogo(clave){
  const C = getC(); const g = C.porLinea[clave]; if(!g || !g.nombre){ toast('Cargale el nombre primero'); return; }
  const l = clave.startsWith('l:') ? lineaPorId(clave.slice(2)) : null;
  const rubro = l ? (getV().rubros.find(r=>r.lineas.some(x=>x.id===l.id))||{}).codigo : '03';
  const pe = nuevaPersona({nombre:g.nombre, tel:g.tel, email:g.email,
    funcion: l ? l.concepto : '', rubro: rubro||'03',
    tarifaRef: l ? n(l.valorUnit) : 0, moneda: l ? l.moneda : 'ARS', unidad: l ? l.unidad : 'jornada'});
  DB.catalogo.personas.push(pe);
  if(l) l.refId = pe.id;          /* la línea queda enlazada */
  delete C.porLinea[clave];
  toast(`${pe.nombre} guardado en el catálogo`); R();
}
function copiarMails(){
  const {mails} = armarContactos(getPy(), getV());
  if(!mails.length){ toast('Todavía no hay mails cargados'); return; }
  const txt = mails.join(', ');

  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(ok, ()=>prompt('Copiá los mails:', txt));

/* --- Puente desglose → presupuesto ---------------------------------------
   Cada departamento cae en el rubro que le corresponde. Se crean las líneas
   con el concepto y la cantidad; los valores los pone una persona.          */
const MAPA_RUBRO = {
  elenco:    {rubro:'09', modo:'porItem',  etiqueta:'Elenco'},
  extras:    {rubro:'09', modo:'agrupado', etiqueta:'Extras / Ambiente'},
  stunts:    {rubro:'09', modo:'agrupado', etiqueta:'Doble de riesgo / coordinador'},
  locacion:  {rubro:'10', modo:'porItem',  etiqueta:'Locaciones'},
  utileria:  {rubro:'06', modo:'agrupado', etiqueta:'Utilería'},
  arte:      {rubro:'06', modo:'agrupado', etiqueta:'Ambientación'},
  animales:  {rubro:'06', modo:'agrupado', etiqueta:'Animales y adiestrador'},
  vestuario: {rubro:'07', modo:'agrupado', etiqueta:'Vestuario'},
  maquillaje:{rubro:'07', modo:'agrupado', etiqueta:'Caracterización'},
  vehiculos: {rubro:'12', modo:'porItem',  etiqueta:'Vehículos'},
  sfx:       {rubro:'11', modo:'agrupado', etiqueta:'Efectos especiales'},
  equipo:    {rubro:'11', modo:'porItem',  etiqueta:'Equipo especial'},
  vfx:       {rubro:'14', modo:'agrupado', etiqueta:'VFX'},
  sonido:    {rubro:'14', modo:'agrupado', etiqueta:'Sonido / música'},
};
function propuestaPresupuesto(){
  const d=getD(), r=resumenDesglose(d), out=[];
  const jorn = d.jornadas.length || r.jornadasEstimadas;
  /* elenco: los días son las jornadas en las que realmente aparece */
  r.personajes.forEach(p=>{
    const js = new Set(d.escenas.filter(e=>e.personajes.includes(p)).map(e=>e.jornada||1));
    out.push({dep:'elenco', rubro:'09', concepto:p, cantidad:1, dias:js.size||1, unidad:'jornada',
      nota:'escenas '+d.escenas.filter(e=>e.personajes.includes(p)).map(e=>e.numero).join(', ')});
  });
  r.locaciones.forEach(l=>{
    const es = d.escenas.filter(e=>e.locacion===l);
    out.push({dep:'locacion', rubro:'10', concepto:'Locación — '+l, cantidad:1,
      dias:new Set(es.map(e=>e.jornada||1)).size||1, unidad:'jornada',
      nota:'escenas '+es.map(e=>e.numero).join(', ')});
  });
  Object.entries(MAPA_RUBRO).forEach(([dep,cfg])=>{
    if(dep==='elenco'||dep==='locacion') return;
    const m = r.porDepto[dep]; if(!m||!m.size) return;
    const items=[...m.values()];
    if(cfg.modo==='porItem') items.forEach(it=>out.push({dep, rubro:cfg.rubro,
      concepto:cfg.etiqueta+' — '+it.nombre, cantidad:1, dias:new Set(it.escenas).size||1,
      unidad:'jornada', nota:'escenas '+it.escenas.join(', ')}));
    else out.push({dep, rubro:cfg.rubro, concepto:cfg.etiqueta+` — ${items.length} elemento${items.length==1?'':'s'}`,
      cantidad:1, dias:1, unidad:'global', nota:items.map(i=>i.nombre).join(', ')});
  });
  return {lineas:out, jornadas:jorn, resumen:r};
}
function aPresupuesto(){
  const v=getV(); if(!v){ toast('Este proyecto no tiene presupuesto'); return; }
  const {lineas, jornadas} = propuestaPresupuesto();
  if(!lineas.length){ toast('No hay nada para enviar'); return; }
  const porRubro={};
  lineas.forEach((l,i)=>{ (porRubro[l.rubro] ||= []).push({...l,i}); });
  abrir(`<div class="ov" onclick="if(event.target===this)cerrar()"><div class="mod">
    <h3>Enviar el desglose al presupuesto</h3><div class="mbody">
      <div class="muted" style="font-size:12px;line-height:1.55;margin-bottom:12px">
        Se crean <b>${lineas.length} líneas</b> en <b>${esc(v.nombre)}</b> con el concepto, la cantidad
        y los días ya calculados desde el desglose. <b>Los valores quedan en cero</b> — los ponés vos.
        Destildá lo que no quieras.</div>
      ${Object.keys(porRubro).sort().map(cod=>{
        const rb = v.rubros.find(x=>x.codigo===cod);
        return `<div style="margin-bottom:11px">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx3);font-weight:700;margin-bottom:4px">
            <span class="rcode">${esc(cod)}</span> ${esc(rb?rb.nombre:'(rubro inexistente)')}</div>
          ${porRubro[cod].map(l=>`<label style="display:flex;gap:8px;align-items:flex-start;padding:3px 0;cursor:pointer">
            <input type="checkbox" data-i="${l.i}" checked style="width:auto;margin-top:3px;flex:none">
            <span style="flex:1;min-width:0">
              <span style="font-size:12.5px">${esc(l.concepto)}</span>
              <span class="muted" style="font-size:10.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                ${l.cantidad} × ${l.dias} ${esc(l.unidad)}${l.nota?' · '+esc(l.nota):''}</span>
            </span></label>`).join('')}
        </div>`;
      }).join('')}
      <label style="display:flex;gap:8px;align-items:center;padding-top:8px;border-top:1px solid var(--line);cursor:pointer">
        <input type="checkbox" id="setj" checked style="width:auto;flex:none">
        <span style="font-size:12.5px">Poner el proyecto en <b>${jornadas} jornada${jornadas==1?'':'s'}</b> de rodaje</span></label>
    </div>
    <div class="mfoot"><button class="btn" onclick="cerrar()">Cancelar</button>
      <button class="btn pri" onclick="confirmarAPresupuesto()">Crear las líneas</button></div>
  </div></div>`);
}
function confirmarAPresupuesto(){
  const {lineas, jornadas} = propuestaPresupuesto();
  const marcadas = [...document.querySelectorAll('.mod input[type=checkbox][data-i]')]
    .filter(c=>c.checked).map(c=>lineas[parseInt(c.dataset.i,10)]);
  const setj = document.getElementById('setj')?.checked;
  const v=getV(); let creadas=0;
  marcadas.forEach(l=>{
    const rb = v.rubros.find(x=>x.codigo===l.rubro); if(!rb) return;
    rb.lineas.push(nuevaLinea({concepto:l.concepto, cantidad:l.cantidad, dias:l.dias,
      unidad:l.unidad, valorUnit:0, notas:l.nota}));
    rb.abierto = true; creadas++;
  });
  if(setj) getPy().jornadas = jornadas;
  cerrar(); DB.ui.tab='presu';
  toast(`${creadas} línea(s) creada(s) — cargá los valores`); R();
}

function bajar(nombre, contenido, tipo){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([contenido],{type:tipo}));
  a.download=nombre; a.click(); URL.revokeObjectURL(a.href); }

function expJSON(){ bajar(`clap-${hoy()}.json`, JSON.stringify(DB,null,2), 'application/json');
  toast('Respaldo descargado'); }
function impJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{ try{
      const d=JSON.parse(fr.result);
      if(!d.productoras) throw new Error('formato');
      if(!confirm('Esto reemplaza todos los datos actuales. ¿Seguir?')) return;
      DB=d; migrar(); cerrar(); toast('Respaldo importado');
    }catch(e){ alert('El archivo no es un respaldo válido de CLAP.'); } };
  fr.readAsText(f); }
function expCSV(){
  const v=getV(), py=getPy(); if(!v) return;
  const q = s => '"'+String(s??'').replace(/"/g,'""')+'"';
  const L = [['Rubro','Código','Concepto','Unidad','Cantidad','Días','Valor unit.','Moneda',
              'Total '+v.monedaBase,'Circuito','Comprobante'].map(q).join(',')];
  v.rubros.forEach(r=>r.lineas.forEach(l=>L.push([r.nombre,r.codigo,l.concepto,l.unidad,l.cantidad,
    l.dias,l.valorUnit,l.moneda,Math.round(totalLinea(l,v)),
    (CIRCUITOS.find(c=>c.v===l.circuito)||{}).l||'',
    (COMPROBANTES.find(c=>c.v===l.comprobante)||{}).l||''].map(q).join(','))));
  const R2=calcular(v);
  L.push('', [q('Subtotal'),'','','','','','','',Math.round(R2.subtotal)].join(','));
  L.push([q(`Fee ${v.capas.fee}%`),'','','','','','','',Math.round(R2.fee)].join(','));
  L.push([q(`Contingencia ${v.capas.contingencia}%`),'','','','','','','',Math.round(R2.contingencia)].join(','));
  L.push([q(`IVA ${v.capas.iva}%`),'','','','','','','',Math.round(R2.iva)].join(','));
  L.push([q('TOTAL'),'','','','','','','',Math.round(R2.total)].join(','));
  bajar(`${py.nombre}-${v.nombre}.csv`, '﻿'+L.join('\n'), 'text/csv;charset=utf-8');
  toast('CSV descargado'); }
