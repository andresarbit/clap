<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLAP — Control, Logística y Administración de Producción</title>
<style>
/* ============================================================
   CLAP — design tokens
   ============================================================ */
:root{
  --bg:#0d0e10; --bg2:#141519; --bg3:#1b1d22; --bg4:#23262c;
  --line:#2c2f36; --line2:#3a3e46;
  --tx:#e8e9ec; --tx2:#9ba1ac; --tx3:#6b7280;
  --ac:#e0a92e;        /* dorado — acento principal */
  --ac2:#f2c65c;
  --ok:#3fb27f; --warn:#e0913e; --bad:#e05a5a; --info:#5b9bd5;
  --r:8px; --r2:12px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans);overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
.app{display:flex;flex-direction:column;height:100dvh}
header{background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;justify-content:center;gap:0;margin-right:6px;flex:none}
.brand b{font-size:18px;letter-spacing:.22em;color:var(--ac);font-weight:800;line-height:1.05}
.brand span{font-size:8.5px;color:var(--tx3);letter-spacing:.02em;line-height:1.2;
  text-transform:uppercase;font-weight:600;white-space:nowrap}
.spacer{flex:1}
.tabs{display:flex;gap:2px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 13px;font-size:12.5px;color:var(--tx2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab.on{color:var(--ac);border-bottom-color:var(--ac)}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{padding:14px;max-width:1500px;margin:0 auto}

/* ---------- controls ---------- */
select,input[type=text],input[type=number],input[type=date],textarea{
  background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:6px 8px;
  color:var(--tx);outline:none;min-width:0;width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--ac);background:var(--bg4)}
select{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);
  background-position:calc(100% - 13px) 13px,calc(100% - 8px) 13px;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:6px 11px;font-size:12.5px;color:var(--tx2);white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--line2);color:var(--tx);background:var(--bg4)}
.btn.pri{background:var(--ac);color:#161005;border-color:var(--ac);font-weight:700}
.btn.pri:hover{background:var(--ac2);color:#161005}
.btn.dgr:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:11.5px}
.seg{display:flex;background:var(--bg3);border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.seg button{padding:6px 12px;font-size:12px;color:var(--tx3);font-weight:600}
.seg button.on{background:var(--ac);color:#161005}
.pick{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:0 0 0 9px;max-width:100%}
.pick label{font-size:9.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;font-weight:700;flex:none}
.pick select{border:none;background:var(--bg3);padding-left:4px;min-width:110px}
.pick select:focus{background:var(--bg3)}

/* ---------- cards ---------- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:12px;overflow:hidden}
.card>h3{padding:10px 13px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx2);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700}
.card>h3 .spacer{flex:1}
.pad{padding:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:3px}
.f>span{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.muted{color:var(--tx3)}
.empty{padding:34px 18px;text-align:center;color:var(--tx3);font-size:13px}

/* ---------- rubro / lineas ---------- */
.rubro{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--bg2);overflow:hidden}
.rhead{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--bg3);cursor:pointer;user-select:none}
.rhead:hover{background:var(--bg4)}
.rcode{font:600 10px var(--mono);color:var(--ac);background:rgba(224,169,46,.12);padding:2px 6px;border-radius:4px;flex:none}
.rname{font-weight:600;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtot{font:600 13px var(--mono);flex:none}
.caret{color:var(--tx3);font-size:10px;flex:none;width:10px}
.rbody{border-top:1px solid var(--line)}

/* fila de línea: grid que colapsa en celu */
.lh,.ln{display:grid;gap:6px;align-items:center;padding:6px 11px;
  grid-template-columns:1fr 88px 62px 62px 108px 74px 116px 30px}
.lh{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);
  background:var(--bg);border-bottom:1px solid var(--line);font-weight:700;position:sticky;top:0;z-index:2}
.ln{border-bottom:1px solid rgba(44,47,54,.5)}
.ln:hover{background:var(--bg3)}
.ln input,.ln select{padding:4px 6px;font-size:12.5px;background:transparent;border-color:transparent}
.ln input:hover,.ln select:hover{border-color:var(--line)}
.ln input:focus,.ln select:focus{background:var(--bg4);border-color:var(--ac)}
.num{text-align:right;font-family:var(--mono)}
.ltot{font:600 12.5px var(--mono);text-align:right;padding-right:4px}
.del{color:var(--tx3);font-size:15px;line-height:1;text-align:center;padding:4px}
.del:hover{color:var(--bad)}
.addln{padding:7px 11px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--bg)}

/* chips de circuito / comprobante */
.chip{font-size:9.5px;padding:2px 6px;border-radius:4px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.c-ban{background:rgba(91,155,213,.15);color:#8dc0ea}
.c-efe{background:rgba(224,145,62,.15);color:#e8ac6b}
.c-otr{background:rgba(155,161,172,.13);color:var(--tx2)}
.d-si{background:rgba(63,178,127,.15);color:#6fd0a3}
.d-no{background:rgba(224,90,90,.15);color:#ef8b8b}
.d-par{background:rgba(224,145,62,.15);color:#e8ac6b}
.ln select.chipsel{width:auto;font-size:10px;padding:1px 18px 1px 5px;border:none;
  background-position:calc(100% - 10px) 9px,calc(100% - 6px) 9px}

/* ---------- totales ---------- */
.tot{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(44,47,54,.6)}
.tot:last-child{border:none}
.tot b{font-family:var(--mono);font-weight:600}
.tot.big{padding-top:11px;margin-top:5px;border-top:2px solid var(--ac);border-bottom:none;font-size:15px}
.tot.big span{font-weight:700}
.tot.big b{color:var(--ac);font-size:17px;font-weight:800}
.tot.sub{color:var(--tx2);font-size:12.5px}
.stick{position:sticky;bottom:0;background:var(--bg2);border-top:1px solid var(--ac);
  padding:9px 13px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5;
  box-shadow:0 -6px 20px rgba(0,0,0,.45)}
.stick .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--tx3);font-weight:700}
.stick .val{font:800 19px var(--mono);color:var(--ac)}
.stick .alt{font:500 11.5px var(--mono);color:var(--tx3)}

/* ---------- tabla catálogo ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);
  padding:7px 9px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.tbl td{padding:6px 9px;border-bottom:1px solid rgba(44,47,54,.5);vertical-align:middle}
.tbl tr:hover td{background:var(--bg3)}
.scrollx{overflow-x:auto}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:100;backdrop-filter:blur(3px)}
.mod{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r2);width:100%;max-width:660px;
  max-height:88dvh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.mod>h3{padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;display:flex;align-items:center;gap:10px}
.mod>h3 .spacer{flex:1}
.mbody{padding:16px;overflow-y:auto;flex:1}
.mfoot{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg4);
  border:1px solid var(--ac);color:var(--tx);padding:10px 18px;border-radius:22px;z-index:200;font-size:13px;
  box-shadow:0 8px 30px rgba(0,0,0,.5)}

/* ---------- desglose de guion ---------- */
.resu{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;background:var(--line)}
.resu>div{background:var(--bg2);padding:10px 12px}
.resu b{display:block;font:700 19px var(--mono);color:var(--ac);line-height:1.15}
.resu span{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);font-weight:700}
.subtabs{display:flex;gap:2px;padding:8px 13px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtab{padding:7px 12px;font-size:12px;color:var(--tx2);border-radius:6px 6px 0 0;white-space:nowrap;font-weight:600}
.subtab.on{background:var(--bg4);color:var(--ac)}

.esc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--bg2);overflow:hidden}
.ehead{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--bg3);flex-wrap:wrap}
.enum{font:800 13px var(--mono);color:var(--ac);min-width:24px;flex:none}
.eie{font:700 9.5px var(--mono);padding:2px 5px;border-radius:3px;flex:none;letter-spacing:.04em}
.eie.int{background:rgba(91,155,213,.16);color:#8dc0ea}
.eie.ext{background:rgba(63,178,127,.16);color:#6fd0a3}
.eloc{font-weight:600;font-size:13px;flex:1;min-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emom{font-size:10px;color:var(--tx3);letter-spacing:.05em;font-weight:700;flex:none}
.emom.noche{color:#8dc0ea}
.epg{font:600 11px var(--mono);color:var(--tx2);flex:none}
.ebody{padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.drow{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.dlbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;
  width:112px;flex:none;padding-top:5px;display:flex;align-items:center;gap:5px}
.ddot{width:7px;height:7px;border-radius:2px;flex:none}
.dels{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:150px}
.el{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 5px 3px 8px;
  border-radius:4px;border:1px solid;background:transparent;line-height:1.3}
.el.sug{border-style:dashed;opacity:.82}
.el button{font-size:13px;line-height:1;opacity:.5;padding:0 1px}
.el button:hover{opacity:1;color:var(--bad)}
.elmas{font-size:11.5px;color:var(--tx3);border:1px dashed var(--line2);border-radius:4px;padding:3px 7px}
.elmas:hover{color:var(--ac);border-color:var(--ac)}
.etxt{font-size:11.5px;color:var(--tx3);line-height:1.5;white-space:pre-wrap;
  border-left:2px solid var(--line);padding:2px 0 2px 9px;margin-top:2px;max-height:120px;overflow-y:auto}
.jda{display:flex;align-items:center;gap:5px;flex:none}
.jda select{width:auto;font-size:11px;padding:3px 20px 3px 7px;background-position:calc(100% - 11px) 11px,calc(100% - 7px) 11px}
.jhead{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--bg4);
  border-radius:var(--r) var(--r) 0 0;border:1px solid var(--line);border-bottom:none;margin-top:12px}
.jhead b{font-size:13px}
.sinasig{border-color:var(--warn)}
.solo-cel{display:none}
.ecar{color:var(--tx3);font-size:11px;flex:none;width:9px}
.ecnt{font:600 10px var(--mono);color:var(--tx3);flex:none}

/* ---------- celular ---------- */
@media (max-width:860px){
  .wrap{padding:10px}
  .lh{display:none}
  .ln{grid-template-columns:1fr 1fr;gap:5px;padding:9px 10px;border-bottom:1px solid var(--line);
      background:var(--bg2);border-radius:6px;margin:6px 8px;position:relative}
  .ln>*:nth-child(1){grid-column:1/-1;padding-right:26px}
  .ln input,.ln select{border-color:var(--line);background:var(--bg3);padding:9px 8px;font-size:15px}
  .ln select{background-position:calc(100% - 13px) 17px,calc(100% - 8px) 17px}
  .ln .ltot{grid-column:1/-1;text-align:right;font-size:15px;padding-top:5px;border-top:1px solid var(--line)}
  .ln .del{position:absolute;top:2px;right:2px;font-size:20px;width:34px;height:34px}
  .btn,.btn.sm{padding:9px 13px;font-size:13px}
  .solo-esc{display:none!important}
  .solo-cel{display:inline-block}
  .el{font-size:13px;padding:6px 4px 6px 10px}
  .el button{padding:4px 7px;font-size:16px;opacity:.75}
  .elmas{font-size:13px;padding:8px 12px}
  .jda select{font-size:13px;padding:7px 22px 7px 9px;background-position:calc(100% - 12px) 15px,calc(100% - 8px) 15px}
  .dlbl{width:100%;padding-top:0}
  .esc .drow{gap:4px}
  .esc:not(.on) .ebody{display:none}
  .esc .ehead{cursor:pointer}
  .ln select.chipsel{font-size:12px;padding:7px 22px 7px 8px;
    background-position:calc(100% - 12px) 15px,calc(100% - 8px) 15px}
  .rhead{padding:12px 11px}
  .ln .mlbl::before{content:attr(data-l);font-size:8.5px;color:var(--tx3);display:block;
    text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px;font-weight:700}
  .stick .val{font-size:16px}
  .brand b{font-size:16px;letter-spacing:.18em}
  .brand span{font-size:7px;letter-spacing:0}
}
/* ---------- impresión ---------- */
@media print{
  body{background:#fff;color:#000}
  header,.tabs,.stick,.addln,.noprint,.del{display:none!important}
  .card,.rubro{border-color:#ccc;background:#fff;break-inside:avoid}
  .rhead{background:#f2f2f2}
  .lh{background:#fafafa;color:#555}
  main{overflow:visible}
  .rcode{color:#8a6a12;background:#f6eed6}
  .tot.big b{color:#000}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================================
   CLAP — Control, Logística y Administración de Producción
   Prototipo v0.1 · presupuestador
   ----------------------------------------------------------------------------
   ARQUITECTURA (pensada para migrar a Postgres/Supabase sin rehacer el modelo)
     MODEL  — schema, catálogos maestros, semillas
     STORE  — persistencia (localStorage hoy, API mañana), export/import
     CALC   — motor de cálculo: líneas → rubros → capas → total
     UI     — render
   Toda entidad lleva id propio y las de proyecto cuelgan de productoraId.
   ============================================================================ */

/* ===========================  MODEL  ====================================== */

const SCHEMA_VERSION = 1;
const uid = p => (p||'x') + '_' + Math.random().toString(36).slice(2,9);

/* Rubros por defecto — estructura de presupuesto publicitario argentino.
   aplicaFee: si el fee de producción se calcula sobre este rubro.            */
const RUBROS_BASE = [
  {codigo:'01', nombre:'Preproducción y Gastos Generales', aplicaFee:true},
  {codigo:'02', nombre:'Dirección',                        aplicaFee:true},
  {codigo:'03', nombre:'Equipo de Producción',             aplicaFee:true},
  {codigo:'04', nombre:'Fotografía y Cámara',              aplicaFee:true},
  {codigo:'05', nombre:'Eléctrica y Grip',                 aplicaFee:true},
  {codigo:'06', nombre:'Arte, Utilería y Ambientación',    aplicaFee:true},
  {codigo:'07', nombre:'Vestuario, Maquillaje y Peinado',  aplicaFee:true},
  {codigo:'08', nombre:'Sonido',                           aplicaFee:true},
  {codigo:'09', nombre:'Elenco y Derechos de Imagen',      aplicaFee:false},
  {codigo:'10', nombre:'Locaciones y Permisos',            aplicaFee:true},
  {codigo:'11', nombre:'Equipamiento y Alquileres',        aplicaFee:true},
  {codigo:'12', nombre:'Transporte, Viáticos y Viajes',    aplicaFee:true},
  {codigo:'13', nombre:'Catering',                         aplicaFee:true},
  {codigo:'14', nombre:'Postproducción',                   aplicaFee:true},
  {codigo:'15', nombre:'Seguros y Legales',                aplicaFee:false},
];

/* Catálogo de funciones por rubro — para cargar líneas rápido.               */
const FUNCIONES = {
  '01':['Scouting','Casting','Pre Production Meeting','Permisos y trámites','Movilidad preproducción','Oficina y comunicaciones'],
  '02':['Director','Ayudante de Dirección (1° AD)','2° Ayudante de Dirección','Script / Continuista','Storyboard artist'],
  '03':['Productor Ejecutivo','Jefe de Producción','Coordinador de Producción','Asistente de Producción','Runner','Location Manager','Director de Casting','Fijador'],
  '04':['Director de Fotografía','Operador de Cámara','Foquista','Asistente de Cámara','DIT','Video Assist','Operador de Steadicam','Piloto de Drone'],
  '05':['Gaffer','Best Boy','Eléctrico','Key Grip','Grip','Maquinista','Generadorista'],
  '06':['Director de Arte','Asistente de Arte','Ambientador','Utilero','Escenógrafo','Constructor','Compras de arte','Construcción de set'],
  '07':['Vestuarista','Asistente de Vestuario','Compra / alquiler de vestuario','Maquillador/a','Peinador/a','Asistente de Maquillaje'],
  '08':['Sonidista Directo','Microfonista','Equipo de sonido directo'],
  '09':['Actor / Actriz Principal','Actor / Actriz Secundario','Extra','Modelo','Voz en off','Buyout / Cesión de derechos','Fee de agencia de casting'],
  '10':['Fee de locación','Permiso municipal / filmación','Fijador de locación','Estudio / plató','Servicios de locación','Limpieza y restitución'],
  '11':['Paquete cámara + ópticas','Paquete de luces','Paquete de grip','Grupo electrógeno','Camión de luces','Monitores','Handies / walkies','Carpa y catering rig','Baños químicos'],
  '12':['Combi de pasajeros','Camión de producción','Auto de producción','Combustible y peajes','Pasajes aéreos','Hotel','Viáticos / per diem','Chofer'],
  '13':['Desayuno','Almuerzo','Merienda / snacks','Agua y bebidas','Catering de elenco'],
  '14':['Postproductor','Montajista','Sala de edición','Colorista','VFX / composición','Diseño sonoro','Musicalización / derechos','Locución','Masterización y entregables'],
  '15':['Seguro de Accidentes Personales','ART','Responsabilidad Civil','Todo Riesgo Equipos','Honorarios contables','Honorarios legales','Impuesto al cheque / gastos bancarios'],
};

/* Unidades de contratación */
const UNIDADES = ['jornada','media jornada','hora','semana','global','unidad','día','km','persona'];

/* Circuito de pago y respaldo documental — la "ductilidad" del sistema.
   Se registra la realidad tal cual es: qué canal y qué comprobante.          */
const CIRCUITOS = [
  {v:'transferencia', l:'Transferencia', k:'ban'},
  {v:'cheque',        l:'Cheque',        k:'ban'},
  {v:'debito',        l:'Débito/Tarjeta',k:'ban'},
  {v:'mp',            l:'Mercado Pago',  k:'ban'},
  {v:'efectivo',      l:'Efectivo',      k:'efe'},
  {v:'usd',           l:'USD billete',   k:'efe'},
  {v:'cripto',        l:'Cripto / USDT', k:'otr'},
  {v:'',              l:'— sin definir', k:'otr'},
];
const COMPROBANTES = [
  {v:'facA',    l:'Factura A',     k:'si'},
  {v:'facBC',   l:'Factura B / C', k:'si'},
  {v:'reciboX', l:'Recibo oficial',k:'si'},
  {v:'reciboS', l:'Recibo simple', k:'par'},
  {v:'ninguno', l:'Sin comprobante',k:'no'},
  {v:'',        l:'— sin definir', k:'par'},
];

const CONDICIONES = ['Responsable Inscripto','Monotributista','Exento','Consumidor Final','Sociedad','Extranjero'];

/* Normaliza para comparar: sin acentos, minúsculas.                          */
const norm = s => String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

/* --- Parser de guion ------------------------------------------------------
   Reconoce formato estándar y Fountain. Un encabezado es INT/EXT + locación
   + momento; un personaje es una línea corta en mayúsculas seguida de texto. */
const RE_SLUG = /^\s*(?:(\d+[A-Za-z]?)[\.\)]?\s+)?(INT\.?\s*\/\s*EXT\.?|EXT\.?\s*\/\s*INT\.?|I\s*\/\s*E|INT\b\.?|EXT\b\.?|INTERIOR\b|EXTERIOR\b)\s*[\.\-—:]*\s*(.+)$/i;
const RE_TRANS = /^\s*(CORTE A|CORTA A|FUNDE|FUNDIDO|DISOLVENCIA|ENCADENA|CUT TO|FADE (IN|OUT)|DISSOLVE|SMASH CUT|FIN|THE END)\b.*$/i;

function parseGuion(txt){
  const lineas = String(txt).replace(/\r\n?/g,'\n').split('\n');
  const escenas = []; let act = null; let nAuto = 0;

  const cerrar = () => { if(act){ act.octavos = Math.max(1, Math.round(act._lineas/6.875)); escenas.push(act); } };

  for(let i=0;i<lineas.length;i++){
    const cru = lineas[i], t = cru.trim();
    const m = t.match(RE_SLUG);
    if(m && t.length<160){
      cerrar();
      /* separar locación de momento por el último guion */
      let resto = m[3].trim().replace(/\s+\d+[A-Za-z]?$/,'');   /* número al final */
      let loc = resto, mom = '';
      const partes = resto.split(/\s+[\-–—]\s+|\s{2,}/);
      if(partes.length>1){
        const ult = partes[partes.length-1].trim().replace(/\.$/,'');
        if(MOMENTOS.some(x=>norm(x)===norm(ult)) || norm(ult).length<=14){
          mom = ult.toUpperCase(); loc = partes.slice(0,-1).join(' - ').trim();
        }
      }
      const ie = norm(m[2]).replace(/[\.\s]/g,'');
      act = nuevaEscena({
        numero: m[1] || String(++nAuto),
        encabezado: t,
        intExt: ie.startsWith('inte')&&ie.length>4 ? 'INT' : ie.startsWith('exte')&&ie.length>4 ? 'EXT'
              : /^(int\/ext|ext\/int|ie)$/.test(ie) ? 'INT/EXT' : ie.startsWith('int') ? 'INT' : 'EXT',
        locacion: loc.replace(/\.$/,'').trim() || 'Sin locación',
        momento: mom || 'DÍA'});
      act._lineas = 0; act.texto = '';
      continue;
    }
    if(!act) continue;                       /* encabezado de guion, títulos, etc. */
    if(RE_TRANS.test(t) && t===t.toUpperCase()) continue;
    act._lineas++;
    act.texto += cru + '\n';
    /* personaje: línea corta en mayúsculas con algo debajo */
    if(t && t.length<=42 && !/^\(.*\)$/.test(t)){
      const soloLetras = t.replace(/\([^)]*\)/g,'').replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/g,'');
      const sig = (lineas[i+1]||'').trim();
      if(soloLetras.length>1 && soloLetras===soloLetras.toUpperCase() && sig){
        const nom = t.replace(/\([^)]*\)/g,'').replace(/[:：]$/,'').trim();
        if(nom && nom.length>1 && !act.personajes.includes(nom)) act.personajes.push(nom);
      }
    }
  }
  cerrar();
  escenas.forEach(e=>{ delete e._lineas; detectar(e); });
  return escenas;
}

/* Sugiere elementos por diccionario. Marca lo detectado en `auto` para poder
   distinguir lo propuesto por la máquina de lo confirmado por una persona.   */
function detectar(e){
  const t = ' ' + norm(e.texto).replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ') + ' ';
  Object.entries(DICC).forEach(([dep, palabras])=>{
    const hall = [];
    palabras.forEach(p=>{ if(t.includes(' '+norm(p)+' ')) hall.push(p); });
    if(hall.length){
      e.elementos[dep] = [...new Set([...(e.elementos[dep]||[]), ...hall])];
      e.auto[dep] = hall;
    }
  });
}

/* Resúmenes ---------------------------------------------------------------- */
const octavosATexto = o => { const p=Math.floor(o/8), r=o%8;
  return (p?p:'') + (p&&r?' ':'') + (r?r+'/8':(p?'':'0')); };

function resumenDesglose(d){
  const esc = d.escenas;
  const octavos = esc.reduce((s,e)=>s+e.octavos,0);
  const pers = new Set(), locs = new Set(), porDepto = {};
  esc.forEach(e=>{
    e.personajes.forEach(p=>pers.add(p));
    locs.add(e.locacion);
    Object.entries(e.elementos).forEach(([k,v])=>{
      porDepto[k] ||= new Map();
      v.forEach(x=>{ const key=norm(x);
        if(!porDepto[k].has(key)) porDepto[k].set(key,{nombre:x, escenas:[]});
        porDepto[k].get(key).escenas.push(e.numero); });
    });
  });
  const paginas = octavos/8;
  return {escenas:esc.length, octavos, paginas, personajes:[...pers].sort(), locaciones:[...locs].sort(),
    porDepto, jornadasEstimadas: Math.max(1, Math.ceil(paginas / Math.max(0.125, d.paginasPorJornada))),
    noches: esc.filter(e=>/NOCHE|NIGHT|MADRUGADA/.test(e.momento)).length,
    ext: esc.filter(e=>e.intExt!=='INT').length};
}

const KEY = 'clap.db.v1';
const KEY_VIEJA = 'cuadro.db.v1';   /* la app se llamaba CUADRO: no perder lo ya cargado */
let DB;

function dbVacia(){
  return {schemaVersion:SCHEMA_VERSION, org:{nombre:'Mi estudio'},
    catalogo:{personas:[]}, productoras:[],
    ui:{productoraId:null, proyectoId:null, versionId:null, vista:'interna', tab:'presu'}};
}

function cargar(){
  try{
    const propio = localStorage.getItem(KEY);
    const raw = propio || localStorage.getItem(KEY_VIEJA);
    if(raw){
      DB = JSON.parse(raw); migrar();
      /* venía de la clave vieja: reescribir ya en la nueva, así el día que se
         borre el fallback no se pierde nada. */
      if(!propio) localStorage.setItem(KEY, JSON.stringify(DB));
      return;
    }
  }catch(e){ console.warn('DB corrupta, arranco limpio', e); }
  DB = dbVacia(); sembrar(); guardar();
}
function migrar(){
  if(!DB.schemaVersion) DB.schemaVersion = 1;
  DB.catalogo ||= {personas:[]};
  DB.ui ||= {vista:'interna', tab:'presu'};
  (DB.productoras||[]).forEach(pr=>(pr.proyectos||[]).forEach(py=>{
    py.desglose ||= nuevoDesglose();
    py.desglose.escenas ||= []; py.desglose.jornadas ||= [];
  }));
}
let _t;
function guardar(){
  clearTimeout(_t);
  _t = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
    catch(e){ toast('⚠ No se pudo guardar (espacio lleno)'); } }, 120);
}

/* ===========================  CALC  ======================================= */

const n = x => { const v = parseFloat(String(x??'').replace(',','.')); return isFinite(v)?v:0; };

/* tc = unidades de ARS por 1 USD */
function conv(monto, de, a, tc){
  if(de===a) return monto;
  if(de==='USD' && a==='ARS') return monto * tc;
  if(de==='ARS' && a==='USD') return tc ? monto / tc : 0;
  return monto;
}
function totalLinea(l, v){
  const bruto = n(l.cantidad) * n(l.dias) * n(l.valorUnit);
  return conv(bruto, l.moneda||'ARS', v.monedaBase, n(v.tc));
}
function totalRubro(r, v){ return r.lineas.reduce((s,l)=>s+totalLinea(l,v), 0); }

/* Motor: subtotal → fee → contingencia → IIBB → IVA → total.
   El fee sólo se aplica sobre los rubros marcados aplicaFee (el elenco y los
   seguros normalmente se pasan a costo, sin fee).                            */
function calcular(v){
  let subtotal=0, baseFee=0;
  const porRubro = v.rubros.map(r=>{
    const t = totalRubro(r,v);
    subtotal += t; if(r.aplicaFee) baseFee += t;
    return {id:r.id, codigo:r.codigo, nombre:r.nombre, total:t, lineas:r.lineas.length};
  });
  const c = v.capas;
  const fee          = baseFee  * n(c.fee)/100;
  const contingencia = subtotal * n(c.contingencia)/100;
  const netoPrevio   = subtotal + fee + contingencia;
  const iibb         = netoPrevio * n(c.iibb)/100;
  const neto         = netoPrevio + iibb;
  const iva          = neto * n(c.iva)/100;
  const total        = neto + iva;
  return {porRubro, subtotal, baseFee, fee, contingencia, iibb, neto, iva, total};
}

/* Exposición documental: cuánto del costo directo tiene respaldo fiscal.     */
function exposicion(v){
  const r = {facturado:0, parcial:0, sinRespaldo:0, sinDefinir:0,
             bancario:0, efectivo:0, otro:0, total:0};
  v.rubros.forEach(rb=>rb.lineas.forEach(l=>{
    const t = totalLinea(l,v); r.total += t;
    const kc = (CIRCUITOS.find(c=>c.v===(l.circuito||''))||{}).k;
    if(kc==='ban') r.bancario+=t; else if(kc==='efe') r.efectivo+=t; else r.otro+=t;
    const kd = (COMPROBANTES.find(c=>c.v===(l.comprobante||''))||{}).k;
    if(!l.comprobante) r.sinDefinir+=t;
    else if(kd==='si') r.facturado+=t;
    else if(kd==='par') r.parcial+=t;
    else r.sinRespaldo+=t;
  }));
  return r;
}

/* ===========================  FORMATO  ==================================== */

const fmt = (x, mon='ARS') => (mon==='USD'?'US$ ':'$ ') +
  Math.round(n(x)).toLocaleString('es-AR');
const fmtC = x => Math.round(n(x)).toLocaleString('es-AR');
const esc  = s => String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pct  = (p,t) => t ? Math.round(p/t*100) : 0;

/* ===========================  UI  ========================================= */

const $ = s => document.querySelector(s);
const app = $('#app');
let modal = null;

function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(), 2200);
}

function render(){
  const pr=getPr(), py=getPy(), v=getV();

}

function cuerpo(pr,py,v){

  return `<div class="esc ${e.abierta?'on':''}">
    <div class="ehead" onclick="if(event.target===this||event.target.closest('.enum,.eloc,.eie,.emom,.epg,.ecar'))toggleEsc('${e.id}')">
      <span class="ecar solo-cel">${e.abierta?'▾':'▸'}</span>
      <span class="enum">${esc(e.numero)}</span>
      <span class="eie ${e.intExt==='INT'?'int':'ext'}">${esc(e.intExt)}</span>
      <span class="eloc">${esc(e.locacion)}</span>
      <span class="emom ${noche?'noche':''}">${esc(e.momento)}</span>
      <span class="epg">${octavosATexto(e.octavos)} pg</span>
      <span class="ecnt solo-cel">${e.personajes.length + Object.values(e.elementos).reduce((s,v)=>s+v.length,0)} el.</span>
      <span class="jda noprint"><span class="muted" style="font-size:9.5px;font-weight:700">JORN.</span>
        <select onchange="setJornada('${e.id}',this.value)">
          <option value="">—</option>
          ${Array.from({length:Math.max(d.jornadas.length, 8)},(_,i)=>i+1).map(nn=>
            `<option value="${nn}" ${e.jornada===nn?'selected':''}>${nn}</option>`).join('')}
        </select></span>
    </div>
    <div class="ebody">
      <div class="drow">
        <span class="dlbl" style="color:${DEPTO('elenco').c}"><i class="ddot" style="background:${DEPTO('elenco').c}"></i>Elenco</span>
        <span class="dels">${e.personajes.map(p=>elHTML(e.id,'personajes',p,DEPTO('elenco').c,false)).join('')
          || '<span class="muted" style="font-size:11.5px;padding-top:4px">sin diálogo</span>'}
          <button class="elmas noprint" onclick="addEl('${e.id}','personajes')">+</button></span>
      </div>
      ${deps.map(dp=>{
        const vals = e.elementos[dp.k]||[]; if(!vals.length) return '';
        return `<div class="drow">
          <span class="dlbl" style="color:${dp.c}"><i class="ddot" style="background:${dp.c}"></i>${esc(dp.l)}</span>
          <span class="dels">${vals.map(v=>elHTML(e.id,dp.k,v,dp.c,(e.auto[dp.k]||[]).includes(v))).join('')}
            <button class="elmas noprint" onclick="addEl('${e.id}','${dp.k}')">+</button></span></div>`;
      }).join('')}
      <div class="drow noprint">
        <span class="dlbl"></span>
        <span class="dels solo-esc">${DEPTOS.filter(dp=>!dp.auto && !(e.elementos[dp.k]||[]).length).map(dp=>
          `<button class="elmas" onclick="addEl('${e.id}','${dp.k}')" style="border-color:${dp.c}44;color:${dp.c}">+ ${esc(dp.l)}</button>`).join('')}
        </span>
        <button class="elmas solo-cel" onclick="pickDepto('${e.id}')">+ Agregar elemento</button></div>
      ${e.texto.trim()?`<details><summary class="muted noprint" style="font-size:11px;cursor:pointer;padding:2px 0">Ver texto de la escena</summary>
        <div class="etxt">${esc(e.texto.trim())}</div></details>`:''}
    </div></div>`;
}
function elHTML(eid, dep, val, color, sugerido){
  return `<span class="el ${sugerido?'sug':''}" style="border-color:${color}66;color:${color}"
    ${sugerido?'title="Sugerido por el diccionario — confirmá o borralo"':''}>${esc(val)}
    <button class="noprint" onclick="delEl('${eid}','${dep}',${JSON.stringify(val).replace(/"/g,'&quot;')})">×</button></span>`;
}

function deptosHTML(r){
  const filas = [];
  filas.push(bloqueDep({k:'elenco',l:'Elenco',c:DEPTO('elenco').c},
    r.personajes.map(p=>({nombre:p, escenas:[]})), true));
  DEPTOS.filter(d=>!d.auto).forEach(dp=>{
    const m = r.porDepto[dp.k]; if(!m||!m.size) return;
    filas.push(bloqueDep(dp, [...m.values()]));
  });
  return filas.join('') || '<div class="empty">Sin elementos cargados</div>';
}
function bloqueDep(dp, items, sinEsc){
  return `<div class="drow" style="border-bottom:1px solid var(--line);padding:9px 0;align-items:flex-start">
    <span class="dlbl" style="color:${dp.c};padding-top:2px"><i class="ddot" style="background:${dp.c}"></i>${esc(dp.l)}
      <span class="muted" style="font-weight:600">${items.length}</span></span>
    <span class="dels">${items.map(it=>
      `<span class="el" style="border-color:${dp.c}66;color:${dp.c}">${esc(it.nombre)}${
        sinEsc?'':`<span class="muted" style="font-size:9.5px;font-weight:700">esc ${it.escenas.join(', ')}</span>`}</span>`).join('')}
    </span></div>`;
}

function planHTML(py,d,r){
  const asignadas = {}; const sin = [];
  d.escenas.forEach(e=>{ if(e.jornada) (asignadas[e.jornada] ||= []).push(e); else sin.push(e); });
  const nums = Object.keys(asignadas).map(Number).sort((a,b)=>a-b);
  const linea = e => `<div class="ehead" style="border:1px solid var(--line);border-top:none;background:var(--bg2)">
      <span class="enum">${esc(e.numero)}</span>
      <span class="eie ${e.intExt==='INT'?'int':'ext'}">${esc(e.intExt)}</span>
      <span class="eloc">${esc(e.locacion)}</span>
      <span class="emom ${/NOCHE|NIGHT|MADRUGADA/.test(e.momento)?'noche':''}">${esc(e.momento)}</span>
      <span class="epg">${octavosATexto(e.octavos)} pg</span>
      <span class="muted" style="font-size:11px">${e.personajes.join(', ')||'—'}</span>
      <span class="jda noprint"><select onchange="setJornada('${e.id}',this.value)">
        <option value="">—</option>
        ${Array.from({length:Math.max(nums.length+1,8)},(_,i)=>i+1).map(nn=>
          `<option value="${nn}" ${e.jornada===nn?'selected':''}>J${nn}</option>`).join('')}
      </select></span></div>`;
  const bloque = (titulo, lista, cls='') => {
    const oct = lista.reduce((s,e)=>s+e.octavos,0);
    const locs = [...new Set(lista.map(e=>e.locacion))];
    return `<div class="jhead ${cls}"><b>${titulo}</b>
      <span class="muted" style="font-size:11.5px">${lista.length} esc · ${octavosATexto(oct)} pg · ${locs.length} loc${locs.length==1?'':'s'}</span>
      <div class="spacer" style="flex:1"></div>
      <span class="muted" style="font-size:11px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(locs.join(' · '))}</span>
    </div>${lista.map(linea).join('')}`;
  };
  return `<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:4px" class="noprint">
      <span class="muted" style="font-size:11.5px">Páginas por jornada</span>
      <input type="number" step="any" min="0.125" value="${d.paginasPorJornada}" style="width:64px"
        onchange="setPagJornada(this.value)">
      <span class="muted" style="font-size:11.5px">→ ${r.jornadasEstimadas} jornada${r.jornadasEstimadas==1?'':'s'} estimada${r.jornadasEstimadas==1?'':'s'}</span>
      <div style="flex:1"></div>
      <button class="btn sm pri" onclick="autoAgrupar()">Auto-agrupar por locación</button>
      <button class="btn sm" onclick="limpiarJornadas()">Desasignar todo</button>
    </div>
    ${nums.map(nn=>bloque('Jornada '+nn, asignadas[nn])).join('')}
    ${sin.length?bloque('Sin asignar', sin, 'sinasig'):''}
    ${!nums.length&&!sin.length?'<div class="empty">Sin escenas</div>':''}`;
}

function toggleRubro(id){ const r=getV().rubros.find(x=>x.id===id); r.abierto=!r.abierto; R(); }
function addLinea(rid){ getV().rubros.find(r=>r.id===rid).lineas.push(nuevaLinea()); R(); }
function delLinea(rid,lid){ const r=getV().rubros.find(x=>x.id===rid);
  r.lineas = r.lineas.filter(l=>l.id!==lid); R(); }
function upLinea(rid,lid,campo,val){
  const l = getV().rubros.find(r=>r.id===rid).lineas.find(x=>x.id===lid);
  l[campo] = ['cantidad','dias','valorUnit'].includes(campo) ? n(val) : val; R(); }
function upCapa(k,val){ getV().capas[k]=n(val); R(); }

function addRubro(){
  const nom = prompt('Nombre del rubro nuevo:'); if(!nom) return;
  const v=getV(); const cod = String(v.rubros.length+1).padStart(2,'0');
  v.rubros.push({id:uid('rb'), codigo:cod, nombre:nom, aplicaFee:true, lineas:[], abierto:true}); R(); }
function delRubro(id){ const v=getV(); const r=v.rubros.find(x=>x.id===id);
  if(r.lineas.length && !confirm(`Eliminar "${r.nombre}" con ${r.lineas.length} línea(s)?`)) return;
  v.rubros = v.rubros.filter(x=>x.id!==id); R(); }

function duplicarVersion(){
  const py=getPy(), v=getV();
  const copia = JSON.parse(JSON.stringify(v));
  copia.id = uid('v'); copia.fecha = hoy(); copia.estado = 'borrador';
  copia.nombre = 'v' + (py.versiones.length+1);
  copia.rubros.forEach(r=>{ r.id=uid('rb'); r.lineas.forEach(l=>l.id=uid('ln')); });
  py.versiones.push(copia); DB.ui.versionId = copia.id;
  toast(`Creada ${copia.nombre} — la anterior queda intacta`); R(); }

/* ---------- modales ---------- */
function abrir(html){ modal = html; render(); }
function cerrar(){ modal = null; render(); }
function campo(l,name,val,tipo='text',extra=''){
  return `<label class="f"><span>${l}</span>
    <input type="${tipo}" name="${name}" value="${esc(val??'')}" ${extra}></label>`; }
function sel(l,name,val,ops){
  return `<label class="f"><span>${l}</span><select name="${name}">
    ${ops.map(o=>{const v=o.v??o,t=o.l??o;return `<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(t)}</option>`}).join('')}

function datos(){ const o={}; document.querySelectorAll('.mod [name]').forEach(e=>o[e.name]=e.value); return o; }

function pickFuncion(rid){

/* Vuelve a pasar el diccionario conservando lo agregado a mano: sólo se
   descartan las sugerencias viejas que ya no aparecen.                       */
function reDetectar(){
  const d=getD(); let nuevos=0;
  d.escenas.forEach(e=>{
    const manual = {};
    Object.entries(e.elementos).forEach(([k,v])=>{
      const auto = e.auto[k]||[];
      const m = v.filter(x=>!auto.includes(x));
      if(m.length) manual[k]=m;
    });
    const antes = Object.values(e.elementos).reduce((s,v)=>s+v.length,0);
    e.elementos = {...manual}; e.auto = {};
    detectar(e);
    nuevos += Math.max(0, Object.values(e.elementos).reduce((s,v)=>s+v.length,0) - antes);
  });
  toast(nuevos?`+${nuevos} elemento(s) nuevo(s)`:'Sin cambios'); R();
}

/* Auto-agrupa: ordena por locación + INT/EXT + momento (así no se salta de un
   lado a otro ni se mezcla día con noche) y llena jornadas hasta el tope de
   páginas. Es un punto de partida, no un plan final.                         */
function autoAgrupar(){
  const d=getD();
  const tope = d.paginasPorJornada*8;
  const orden = [...d.escenas].sort((a,b)=>
    a.locacion.localeCompare(b.locacion) || a.intExt.localeCompare(b.intExt) ||
    a.momento.localeCompare(b.momento) || String(a.numero).localeCompare(String(b.numero),undefined,{numeric:true}));
  let j=1, acum=0;
  orden.forEach(e=>{
    if(acum && acum+e.octavos>tope){ j++; acum=0; }
    e.jornada=j; acum+=e.octavos;
  });
  sincronizarJornadas(d);
  toast(`Agrupado en ${j} jornada${j==1?'':'s'}`); R();
}
function sincronizarJornadas(d){
  const max = d.escenas.reduce((m,e)=>Math.max(m, e.jornada||0), 0);
  d.jornadas = Array.from({length:max},(_,i)=>d.jornadas[i] || {id:uid('j'), numero:i+1, fecha:'', notas:''});
}

/* --- Puente desglose → presupuesto ---------------------------------------
   Cada departamento cae en el rubro que le corresponde. Se crean las líneas
   con el concepto y la cantidad; los valores los pone una persona.          */
const MAPA_RUBRO = {
  elenco:    {rubro:'09', modo:'porItem',  etiqueta:'Elenco'},
  extras:    {rubro:'09', modo:'agrupado', etiqueta:'Extras / Ambiente'},
  stunts:    {rubro:'09', modo:'agrupado', etiqueta:'Doble de riesgo / coordinador'},
  locacion:  {rubro:'10', modo:'porItem',  etiqueta:'Locaciones'},
  utileria:  {rubro:'06', modo:'agrupado', etiqueta:'Utilería'},
  arte:      {rubro:'06', modo:'agrupado', etiqueta:'Ambientación'},
  animales:  {rubro:'06', modo:'agrupado', etiqueta:'Animales y adiestrador'},
  vestuario: {rubro:'07', modo:'agrupado', etiqueta:'Vestuario'},
  maquillaje:{rubro:'07', modo:'agrupado', etiqueta:'Caracterización'},
  vehiculos: {rubro:'12', modo:'porItem',  etiqueta:'Vehículos'},
  sfx:       {rubro:'11', modo:'agrupado', etiqueta:'Efectos especiales'},
  equipo:    {rubro:'11', modo:'porItem',  etiqueta:'Equipo especial'},
  vfx:       {rubro:'14', modo:'agrupado', etiqueta:'VFX'},
  sonido:    {rubro:'14', modo:'agrupado', etiqueta:'Sonido / música'},
};
function propuestaPresupuesto(){
  const d=getD(), r=resumenDesglose(d), out=[];
  const jorn = d.jornadas.length || r.jornadasEstimadas;
  /* elenco: los días son las jornadas en las que realmente aparece */
  r.personajes.forEach(p=>{
    const js = new Set(d.escenas.filter(e=>e.personajes.includes(p)).map(e=>e.jornada||1));
    out.push({dep:'elenco', rubro:'09', concepto:p, cantidad:1, dias:js.size||1, unidad:'jornada',
      nota:'escenas '+d.escenas.filter(e=>e.personajes.includes(p)).map(e=>e.numero).join(', ')});
  });
  r.locaciones.forEach(l=>{
    const es = d.escenas.filter(e=>e.locacion===l);
    out.push({dep:'locacion', rubro:'10', concepto:'Locación — '+l, cantidad:1,
      dias:new Set(es.map(e=>e.jornada||1)).size||1, unidad:'jornada',
      nota:'escenas '+es.map(e=>e.numero).join(', ')});
  });
  Object.entries(MAPA_RUBRO).forEach(([dep,cfg])=>{
    if(dep==='elenco'||dep==='locacion') return;
    const m = r.porDepto[dep]; if(!m||!m.size) return;
    const items=[...m.values()];
    if(cfg.modo==='porItem') items.forEach(it=>out.push({dep, rubro:cfg.rubro,
      concepto:cfg.etiqueta+' — '+it.nombre, cantidad:1, dias:new Set(it.escenas).size||1,
      unidad:'jornada', nota:'escenas '+it.escenas.join(', ')}));
    else out.push({dep, rubro:cfg.rubro, concepto:cfg.etiqueta+` — ${items.length} elemento${items.length==1?'':'s'}`,
      cantidad:1, dias:1, unidad:'global', nota:items.map(i=>i.nombre).join(', ')});
  });
  return {lineas:out, jornadas:jorn, resumen:r};
}

    (COMPROBANTES.find(c=>c.v===l.comprobante)||{}).l||''].map(q).join(','))));
  const R2=calcular(v);
  L.push('', [q('Subtotal'),'','','','','','','',Math.round(R2.subtotal)].join(','));

  L.push([q('TOTAL'),'','','','','','','',Math.round(R2.total)].join(','));
  bajar(`${py.nombre}-${v.nombre}.csv`, '﻿'+L.join('\n'), 'text/csv;charset=utf-8');
  toast('CSV descargado'); }
